<title>確率人生 デモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 統計年鑑の一頁。上に人生のパラメータ、中央に分岐カード、下に新しい年が上に積まれる年表 */
:root{
  --paper:#eef1f2; --sheet:#fbfcfc; --ink:#1d2a33; --muted:#5f6f79; --rule:#cfd8dc;
  --accent:#1f5f8b; --mark:#f2d24b; --plus:#2e7d5b; --minus:#b2473e; --soc:#6b5b95;
  --f-story:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181c; --sheet:#1a2227; --ink:#e3e9ec; --muted:#93a3ad; --rule:#2e3a41;
  --accent:#7fb6dc; --mark:#c9a92c; --plus:#6cc49b; --minus:#e2857b; --soc:#b3a3dd; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181c; --sheet:#1a2227; --ink:#e3e9ec; --muted:#93a3ad; --rule:#2e3a41;
  --accent:#7fb6dc; --mark:#c9a92c; --plus:#6cc49b; --minus:#e2857b; --soc:#b3a3dd; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-story);font-size:1.5rem;margin:0;letter-spacing:.04em}
.tag{font-family:var(--f-num);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.profile{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px;display:grid;gap:12px}
.who{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline}
.age{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1}
.age small{font-size:.8rem;color:var(--muted);margin-left:2px}
.meta{color:var(--muted);font-size:.85rem}
.household{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem}
.household b{font-weight:700}
.household:empty{display:none}
.log li.family{background:color-mix(in srgb,var(--plus) 10%,transparent)}
.status{font-size:.8rem;border:1px solid var(--ink);padding:0 8px}
.sub{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.conds{display:flex;gap:6px;flex-wrap:wrap}
.cond{font-size:.75rem;color:var(--minus);border:1px solid var(--minus);padding:0 7px}
.cond.ok{color:var(--plus);border-color:var(--plus)}
.cond .dots{letter-spacing:1px;font-size:.62rem}
.money{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--rule);padding-top:10px}
.money .big{font-family:var(--f-num);font-size:1.35rem;font-weight:600}
.money .big.neg{color:var(--minus)}
.money .lbl{font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat.fatigue .bar i{background:var(--minus)}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.stat label b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.bar{height:6px;background:var(--rule);margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .4s ease}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--sheet);border:0;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.controls .hint{font-size:.8rem;color:var(--muted);margin-left:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.scene{background:var(--sheet);border:1.5px solid var(--ink);padding:20px;display:grid;gap:14px}
.scene-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.scene-head .yr{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.scene-head h2{font-family:var(--f-story);font-size:1.2rem;margin:0}
.story{font-family:var(--f-story);font-size:1.02rem;line-height:1.95;margin:0}
.echo{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 55%,transparent) 60%)}
.echo-note{display:inline-block;font-family:var(--f-ui);font-size:.72rem;color:var(--accent);border:1px solid var(--accent);padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.q{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:grid;gap:6px;align-content:start;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--rule);padding:11px 13px;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opt:disabled{cursor:default;opacity:.35}
.opt .short{font-size:.72rem;color:var(--minus)}
.opt.picked{opacity:1;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opt .lbl{font-weight:700}
.opt .info{display:block;font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:1px}
.chip{font-family:var(--f-num);font-size:.68rem;padding:0 6px;border:1px solid currentColor;white-space:nowrap}
.chip.p{color:var(--plus)} .chip.m{color:var(--minus)}

.roll{display:grid;gap:8px}
.roll .q{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.why{font-size:.75rem;color:var(--accent)}
.strip{position:relative;display:flex;height:32px;border:1px solid var(--rule)}
.seg{border-right:1px solid var(--sheet);background:color-mix(in srgb,var(--accent) var(--s,20%),var(--sheet));transition:background .3s;min-width:2px}
.seg:last-child{border-right:0}
.seg.hit{background:var(--mark)}
.needle{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);left:0;transform:translateX(-1px)}
.needle::before{content:"";position:absolute;top:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;justify-content:space-between;gap:8px}
.legend .hit{color:var(--ink);font-weight:700}
.outcome{font-family:var(--f-story);font-size:1rem;line-height:1.9;margin:0;border-left:3px solid var(--mark);padding-left:12px}
.next{justify-self:end}

.log h3,.review h3{font-size:.75rem;letter-spacing:.1em;color:var(--muted);margin:0 0 6px;font-weight:500}
.log ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:3.2em 3.6em 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.log li .a{font-family:var(--f-num);color:var(--muted)}
.log li .t{min-width:0}
.log li .m{font-family:var(--f-num);font-size:.75rem;color:var(--muted);white-space:nowrap;text-align:right}
.log li .m.neg{color:var(--minus)}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-align:center;padding:1px 0;border:1px solid currentColor}
.b-good{color:var(--plus)} .b-normal{color:var(--muted)} .b-bad{color:var(--minus)} .b-soc{color:var(--soc)} .b-fork{color:var(--accent)} .b-life{color:var(--ink)}
.b-slope{color:var(--minus);border-style:dashed} .b-rise{color:var(--plus);border-style:dashed} .b-gray{color:var(--muted);border-color:transparent}
.log li.slope .t{color:var(--minus)}
.opts.one{grid-template-columns:1fr}
.b-rainbow{border:0;color:#fff;background:linear-gradient(90deg,#e0565b,#e8a33d,#5bb26a,#3f88c5,#8a5cc2)}
.log li.rainbow{background:color-mix(in srgb,var(--mark) 18%,transparent)}
.log li.fresh{animation:in .35s ease}
@keyframes in{from{background:color-mix(in srgb,var(--mark) 35%,transparent)}}

.review{display:grid;gap:18px}
.spark{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.spark div{font-size:.75rem;color:var(--muted);min-width:0}
.spark svg{display:block;width:100%;height:40px}
.spark b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.forks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.forks li{font-size:.86rem;display:grid;grid-template-columns:3.2em 1fr;gap:8px}
.forks .a{font-family:var(--f-num);color:var(--muted)}
.forks small{display:block;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.facts div{border-top:1px solid var(--rule);padding-top:6px;font-size:.75rem;color:var(--muted)}
.facts b.neg{color:var(--minus)}
.facts b{display:block;font-family:var(--f-num);font-size:1.05rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>確率人生</h1>
    <span class="tag">demo v3</span>
  </header>

  <section class="profile" aria-label="現在の状態">
    <div class="who"><span class="age" id="age">0<small>歳</small></span><span class="status" id="status">—</span><span class="meta" id="meta"></span></div>
    <div class="stats" id="stats"></div>
    <div class="sub household" id="household"></div>
    <div class="sub"><span id="family">実家：—</span><span class="conds" id="conds"></span></div>
    <div class="money"><span><span class="lbl" id="mlbl">資産 </span><span class="big" id="money">0万円</span><span class="lbl" id="assets" style="display:block"></span><span class="lbl" id="flow" style="display:block"></span></span><span><span class="lbl">年収 </span><span class="num" id="inc">—</span></span></div>
  </section>

  <div class="controls" id="controls">
    <button class="btn" id="play">▶ 自動で進める</button>
    <button class="btn ghost" id="step">1年進める</button>
    <button class="btn ghost" id="speed">速度 ×1</button>
    <span class="hint" id="hint">選択は2〜3年に1回＋きっかけがあったとき</span>
  </div>

  <section class="scene" id="scene" hidden aria-live="polite"></section>

  <section class="log">
    <h3>年表</h3>
    <ol id="log"></ol>
  </section>
</div>

<script>
/* ========== 基本 ========== */
const STATS=[["health","健康"],["happy","幸福"],["know","知識"],["bond","人間関係"],["luck","運"]];
const SN={...Object.fromEntries(STATS),skill:"熟練",fatigue:"疲労"};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function pickW(arr,wf){const ws=arr.map(wf),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return i}return arr.length-1}
/* 重み関数：能力値に比例 / 反比例 */
const U=(k,off=0,m=1)=>s=>Math.max(1,(s[k]-off)*m);
const D=(k,m=1)=>s=>Math.max(1,(100-s[k])*m);
const UA=(a,b,off=0,m=1)=>s=>Math.max(1,((s[a]+s[b])/2-off)*m);
const DA=(a,b,m=1)=>s=>Math.max(1,(100-(s[a]+s[b])/2)*m);
const o=(l,w,fx,t,set)=>({l,w,fx:fx||{},t,set});
const man=n=>{const v=Math.round(n);return(v<0?"−":"")+Math.abs(v).toLocaleString("ja-JP")+"万円"};
const echo=t=>t.replace(/\[\[(.+?)\|(.+?)\]\]/g,'<span class="echo">$1</span><span class="echo-note">← $2</span>');
const tx=(t,s)=>typeof t==="function"?t(s):t;

/* ========== 仕事：職種 × 雇用の形・熟練・年収レンジ ========== */
/* 職種と、熟練の伸びに効く能力 */
const JT={sales:{n:"対人・営業",st:["bond","luck"]},service:{n:"接客・飲食",st:["bond","health"]},office:{n:"事務・総合職",st:["know","bond"]},
  tech:{n:"技術・IT",st:["know","luck"]},care:{n:"医療・福祉",st:["bond","health"]},field:{n:"現場・製造",st:["health","know"]},
  research:{n:"研究・専門",st:["know","happy"]},gov:{n:"行政",st:["know","bond"]},founder:{n:"経営・自営",st:["luck","know"]},art:{n:"表現",st:["happy","luck"]},sport:{n:"競技",st:["health","luck"]}};
/* 職種の近さ（転職時に職歴を引き継ぐ率）。書いていない組み合わせは 0.1 */
const NEAR={"sales|service":.6,"sales|office":.4,"sales|care":.2,"sales|founder":.5,"sales|art":.2,"service|office":.3,"service|care":.4,"service|field":.3,
  "service|founder":.4,"service|art":.2,"office|tech":.3,"office|care":.2,"office|field":.2,"office|research":.3,"office|founder":.3,"tech|field":.2,
  "tech|research":.5,"tech|founder":.4,"tech|art":.2,"care|field":.3,"care|research":.2,"care|founder":.2,"care|sport":.2,"field|founder":.2,"field|sport":.2,
  "research|founder":.2,"office|gov":.6,"gov|sales":.2,"gov|care":.2,"gov|research":.2,"research|art":.2,"founder|art":.2,"art|sport":.2};
const near=(a,b)=>a===b?1:NEAR[a+"|"+b]??NEAR[b+"|"+a]??.1;
/* 雇用の形 */
const FORMS={large:"大手",small:"中小",public:"公務",irregular:"非正規",self:"自営"};
/* 年収レンジ [下限, 上限]（万円/年。下限＝入ったばかり、上限＝熟練100）
   出典：厚生労働省「賃金構造基本統計調査」（令和5年）の職種別・企業規模別・雇用形態別の
   きまって支給する現金給与額×12＋年間賞与 を参考にした概算。自営は同調査の対象外のため、
   総務省「就業構造基本調査」の自営業主の所得分布を参考に幅を広くとった。 */
const WAGE={
  sales:   {large:[350,900], small:[300,600], public:[330,650], irregular:[180,300],self:[200,800]},
  service: {large:[300,650], small:[250,450], public:[300,550], irregular:[150,260],self:[180,700]},
  office:  {large:[380,900], small:[300,550], public:[330,750], irregular:[180,300],self:[200,500]},
  tech:    {large:[420,1000],small:[350,700], public:[360,750], irregular:[220,400],self:[250,1000]},
  care:    {large:[350,650], small:[280,480], public:[350,700], irregular:[180,300],self:[220,550]},
  field:   {large:[330,650], small:[270,480], public:[300,550], irregular:[170,280],self:[200,550]},
  gov:     {large:[330,750], small:[330,750], public:[330,750], irregular:[180,300],self:[200,500]},
  research:{large:[450,1100],small:[380,750], public:[400,850], irregular:[220,400],self:[200,900]},
  founder: {large:[400,1500],small:[300,900], public:[330,700], irregular:[200,350],self:[150,1200]},
  art:     {large:[320,800], small:[250,500], public:[300,550], irregular:[120,260],self:[100,1000]},
  sport:   {large:[350,650], small:[300,550], public:[300,550], irregular:[150,280],self:[150,1200]}};
/* 仕事名 → 職種。"=" は今の職種を引き継ぐ（昇進・転職先など）。載っていない名前も引き継ぎ扱い */
const JOB_TYPE={"営業職":"sales","中小企業の営業":"sales",
  "販売員":"service","スポーツ用品店の店員":"service","店舗スタッフ":"service","店舗社員":"service","コンビニ店員":"service","売店スタッフ":"service","アルバイト":"service","パート":"service","パート勤務":"service","短期スタッフ":"service","店主":"service",
  "大手企業 会社員":"office","中小企業 会社員":"office","地元企業 会社員":"office","地元企業の会社員":"office","会社員":"office","中堅企業の会社員":"office","大手メーカー社員":"office",
  "事務職":"office","事務補助":"office","中小企業の事務":"office","地方公務員":"gov","市役所職員":"gov","契約社員":"office","地元の契約社員":"office","派遣社員":"office","嘱託職員":"office","新分野の社員":"office",
  "ITエンジニア":"tech","受託開発エンジニア":"tech","派遣テスター":"tech",
  "医療職":"care","介護職":"care","非常勤職員":"care",
  "工場 正社員":"field","軽作業スタッフ":"field","倉庫の軽作業":"field","ビル清掃":"field","施設清掃":"field","作業所":"field","作業所・アルバイト":"field","在宅データ入力":"field","在宅ワーク":"field",
  "研究者":"research","専門職の会社員":"research",
  "個人事業主":"founder","会社経営者":"founder","共同経営者":"founder","家業":"founder","アプリ会社代表":"founder",
  "所属アーティスト":"art","アルバイト・創作活動":"art","俳優":"art","タレント":"art","作家":"art","配信者":"art",
  "プロ選手":"sport","実業団選手":"sport","コーチ":"sport","コーチ・解説者":"sport",
  "課長":"=","主要部署の管理職":"=","閑職":"=","再就職先":"=","再就職先 社員":"=","転職先の管理職":"=","転職先の社員":"=","転職先の会社員":"=","紹介先の社員":"=","新しい仕事":"=","新規事業担当":"="};
const formOf=(name,kind,prev)=>kind==="public"?"public":kind==="irregular"?"irregular":kind==="founder"||kind==="pro"||kind==="art"?"self":
  /大手|メーカー|大病院/.test(name)?"large":prev&&prev.kind==="corp"&&JOB_TYPE[name]==="="?prev.form:"small";
/* 虹ルートの仕事は年収レンジの対象外（道ごとの曲線は後の段階で入れる） */
const isTrackJob=name=>name==="プロ選手"||name==="俳優"||typeof TRACKS!=="undefined"&&Object.values(TRACKS).some(t=>t.chance.hit.job&&t.chance.hit.job.name===name);
const wageAt=(j,sk)=>{const[lo,hi]=WAGE[j.type][j.form];return lo+(hi-lo)*Math.pow(sk/100,1.5)};
/* 地域の賃金差：同じ職種なら東京は1割増し程度。大企業や IT・研究・総合職の上の層は東京に集中していて差が大きい */
function regionWage(j){if(typeof cityF!=="function"||!s)return 1;const f=cityF();
  if(f>=1.3)return 1.08+(j.form==="large"||["tech","research","office"].includes(j.type)?.12:0);return f>=1.05?1.03:.95}
function jobInc(j){if(j.legacy)return j.inc;const[lo,hi]=WAGE[j.type][j.form];return Math.round(Math.max(lo*.8,Math.min(hi*1.2,wageAt(j,j.skill)*j.mul))*regionWage(j))}
/* 年収に倍率をかける（昇進・評価・不況など）。レンジの仕事は倍率として残す */
function jobMul(s,v){const j=s.job;if(!j)return;if(j.legacy)j.inc*=v;else{j.mul=Math.max(.6,Math.min(1.6,j.mul*v));j.inc=jobInc(j)}}
/* 熟練の初期値：関連能力 × 0.3（30まで）＋ 近い職種の職歴 × 近さ × 0.6 */
const aptOf=(s,type)=>JT[type].st.reduce((a,k)=>a+s[k],0)/JT[type].st.length;
const carryOf=(s,type)=>Math.max(0,...Object.entries(s.exp||{}).map(([k,v])=>v*near(k,type)*.6));
function setJob(s,name,inc,grow,kind,jtype){
  const prev=s.job,code=jtype||JOB_TYPE[name],inherit=code===undefined||code==="=";
  const type=inherit?(prev?prev.type:s.lastType||"office"):code;
  const legacy=isTrackJob(name),form=formOf(name,kind,prev);
  const keep=inherit&&prev&&prev.type===type;
  const skill=keep?prev.skill:Math.min(80,Math.min(30,aptOf(s,type)*.3)+carryOf(s,type));
  s.job={name,inc,grow,kind,type,form,skill,mul:1,legacy};
  if(!legacy&&inc==null)s.job.inc=jobInc(s.job);

const PRESS_MAP={bond:"iso",health:"tired",money:"poor",happy:"apathy"};
function updateConds(){
  if(s.press.tired){addFatigue(s.press.tired*8);s.press.tired=0}
  for(const k in CONDS){const c=CONDS[k],g=c.gap(s),lv=s.cd[k];
    if(g>0&&lv<3){const p=Math.min(.6,.03+g/70+s.press[k]*.05);
      if(Math.random()<p){s.cd[k]++;addRow("slope","傾き",c.up[s.cd[k]]);lv3(k)}}
    else if(g<-5&&lv>0&&Math.random()<.3+(-g)/100){s.cd[k]--;addRow("rise","回復",c.down)}
    s.press[k]*=.6;
    for(let i=0;i<s.cd[k];i++)for(const st in c.drain)s[st]=clamp(s[st]+c.drain[st]);}
}
function lv3(k){if(s.cd[k]<3)return;
  if(k==="iso"){
    if(s.status==="school"&&s.age>=10&&s.age<=17){s.status="futoko";s.hikiSince=s.age;addRow("slope","傾き","ある朝、玄関で足が動かなくなった。学校に行かない日が続いた。")}
    else if(s.status==="jobless"&&s.age<60){s.status="hikikomori";s.hikiSince=s.hikiSince||s.age;addRow("slope","傾き","外に出ない日が、週から月になり、月から年になった。")}}
  if(k==="tired"&&s.status==="work"&&Math.random()<.5){s.status="jobless";s.job=null;addRow("slope","傾き","休職ののち、仕事を辞めた。")}
  if(k==="apathy"&&s.job){jobMul(s,.92);addRow("slope","傾き","仕事でミスが続いた。評価が下がった。")}
}

  for(const k in r.cond_max||{})if(s.cd[k]>r.cond_max[k])return false;
  if(r.parents_alive!==undefined&&s.parentsAlive!==r.parents_alive)return false;

/* 虹ルートの曲線：道ごとの値（実力・人気など）が毎年動き、年収はその値で決まる。低い年が続くと失敗で終わる */
const gauss=sd=>(Math.random()+Math.random()+Math.random()-1.5)*2*sd;

const CURVE_STEP={

  buzz: (s,c)=>-3+(s.bond-50)/15+gauss(c.sd??10),                                          /* 人気は上下しながら減っていく */
  grind:(s,c)=>1.5+(s.know-60)/20+gauss(c.sd??3),                                          /* ゆっくり積み上がる */
  swing:(s,c)=>(s.luck-50)/10+gauss(c.sd??12)};                                            /* 振れ幅が大きい */

function trackCurve(){
  const t=TRACKS[s.track];if(!t||!t.curve||s.trackEnded)return;
  const c=t.curve,hit=t.chance.hit.job;

  if(s.tv===undefined){s.tv=Math.max(10,Math.min(90,(c.start??40)+(avgOf(s,t.chance.stats)-50)/2));s.tvLow=0;return}
  let d=CURVE_STEP[c.type](s,c)+(c.drift||0);

  if(hit&&s.job&&s.job.legacy)s.job.inc=Math.round(hit.income*(.4+s.tv/60));
  s.tvLow=s.tv<TRACK_FAIL_LINE?s.tvLow+1:0;

/* 能力値は高いほど上がりにくい（50で1倍、80で0.7倍、95で0.55倍）。疲労はそのまま増減する */

function famFatF(){let f=1;

  if(s.kids&&s.kidList){const ks=s.kidList.filter(k=>kidAge(k)>0&&kidHome(k));if(ks.length)f-=(ks.reduce((a,k)=>a+k.grow,0)/ks.length-50)/200}

  if(k==="money")s.money+=v;else if(k==="incMul")jobMul(s,v);else if(k==="fatigue")addFatigue(v);else s[k]=clamp(s[k]+(v>0?v*gainF(s[k]):v))}}

  const tri=v=>{const m=v%200;return m<100?m:200-m};
  (function f(t){const k=Dur?Math.min(1,(t-t0)/Dur):1,ez=1-Math.pow(1-k,3);nd.style.left=tri(S*ez)+"%";if(k<1)requestAnimationFrame(f);else land(d,c,r,box,res,ps,pos)})(t0);
}
function land(d,c,r,box,res,ps,pos){
  const x=r.o[res];
  box.querySelectorAll(".seg")[pos].classList.add("hit");box.querySelectorAll(".legend > span")[pos].classList.add("hit");
  applyFx(x.fx);if(x.set)x.set(s);const cm=r===c.roll?settleChoice(c,r,x):null;
  const out=document.createElement("p");out.className="outcome";out.innerHTML=echo(tx(x.t,s)||x.l)+chips({...(cm||{}),...x.fx});box.appendChild(out);
  const pr=ps[res]<1?"<1":Math.round(ps[res]);
  if(d.rainbow){addRow("rainbow","★ 虹",`${r.q}：${x.l}（${pr}%）`)}
  else if(d.birth){addRow("life","誕生",`${r.q}：${x.l}（${pr}%）`)}
  else{s.forks.push({age:s.age,title:d.title,choice:c.l,res:x.l,p:pr,q:r.q});
    addRow("fork","分岐",`${d.title}：${c.l} → ${x.l}（${pr}%）`);}
  render();
  if(r===c.roll&&c.then){setTimeout(()=>roll(d,c,c.then(s)),reduce?0:500);return}
  snap();
  const nb=document.createElement("button");nb.className="btn next";nb.textContent=d.birth?"人生をはじめる":"続ける";
  nb.onclick=()=>{pending=false;if(afterDecision())return;$("scene").hidden=true;if(d.birth&&!auto)setAuto(true);else if(auto)timer=setTimeout(step,400);};
  box.appendChild(nb);nb.focus({preventScroll:true});
}

/* ========== 死と振り返り ========== */
/* 最も長く続けた職種 */
function kidStory(){const g=s.grandkids||0;return g?`孫は${g}人。`:""}
function longestType(){const e=Object.entries(s.typeYears||{}).sort((a,b)=>b[1]-a[1])[0];return e?`最も長く続けた職種は${JT[e[0]].n}（${e[1]}年・熟練${Math.round(s.exp[e[0]]||0)}）。`:""}
function die(){
  s.alive=false;setAuto(false);snap();render();
  const cause=s.deathCause==="accident"?"思いがけない事故で":s.deathCause==="ill"?(s.age-(s.illSince||s.age)>=5?"長い闘病の末に":"病気で"):s.age>=90?"眠るように":"静かに";
  addRow("life","死",`${s.year}年、${s.age}歳で${cause}息を引き取った。`);
  const career=s.hikiYears>=10?"長い時間を部屋の中で過ごし":s.jobs.length?`${s.jobs.includes("プロ選手")?"プロ選手として活躍し":[...new Set(s.jobs)].slice(-2).join("、") + "として働き"}`:"働くことはなく";
  const sc=$("scene");sc.hidden=false;$("controls").hidden=true;
  sc.innerHTML=`<div class="scene-head"><span class="yr">${s.birthYear}–${s.year}</span><h2>ある人生の記録</h2></div>
   <p class="story">${s.pref}の${s.parent}（世帯年収${FAM[s.fam][0]}）に${s.sex==="f"?"女の子":"男の子"}として生まれ、${career}、${s.age}歳で亡くなった。${s.married?"結婚し":s.flags.divorced?"離婚を経験し":"結婚はせず"}、${s.kids?`子どもを${s.kids}人育てた。${kidStory()}`:"子どもはいなかった。"}${longestType()}${s.track&&TRACKS[s.track]?`★${TRACKS[s.track].name}の道を${s.trackSince}歳から歩いた。`:""}${s.bankruptAge?`${s.bankruptAge}歳で自己破産し、そこから立て直した。`:""}</p>
   <div class="review">
    <div class="facts">
      <div>最終資産<b class="${netWorth()<0?"neg":""}">${man(netWorth())}</b></div>
      <div>最大資産<b>${man(s.peak)}</b></div>${assetLine()?`<div>内訳<b style="font-size:.8rem">${assetLine()}</b></div>`:""}
      <div>虹イベント<b>${s.rainbow}回</b></div>
      <div>分岐<b>${s.forks.length}回</b></div>
      <div>最も深い傾き<b>${s.slopeMax}／3</b></div>
    </div>
    <div><h3>パラメータの推移</h3><div class="spark">${STATS.map(([k,n])=>`<div>${n} <b>${s[k]}</b>${spark(k)}</div>`).join("")}<div>資産 <b>${man(s.money)}</b>${spark("money")}</div></div></div>
    <div><h3>分岐点</h3><ul class="forks">${s.forks.map(l=>`<li><span class="a">${l.age}歳</span><span>${l.title}：${l.choice}<small>${l.q}：${l.p}%の「${l.res}」を引いた</small></span></li>`).join("")}</ul></div>
    <button class="btn" id="again" style="justify-self:start">もう一度生まれる</button>
   </div>`;
  $("again").onclick=()=>{newLife();window.scrollTo({top:0})};
}
function spark(k){
  const h=s.hist,mx=Math.max(...h.map(x=>x.age),1);
  let lo=0,hi=100;if(k==="money"){lo=Math.min(...h.map(x=>x.money),0);hi=Math.max(...h.map(x=>x.money),1)}
  const y=v=>(37-(v-lo)/(hi-lo||1)*34).toFixed(1);
  const pts=h.map(x=>`${(x.age/mx*100).toFixed(1)},${y(x[k])}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  const zero=k==="money"&&lo<0?`<line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--minus)" stroke-width="0.6" stroke-dasharray="2 2"/>`:"";
  return`<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">${zero}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="1.8" fill="var(--accent)"/></svg>`;
}

newLife();
</script>
