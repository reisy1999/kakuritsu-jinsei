<title>確率人生 デモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 統計年鑑の一頁。上に人生のパラメータ、中央に分岐カード、下に新しい年が上に積まれる年表 */
:root{
  --paper:#eef1f2; --sheet:#fbfcfc; --ink:#1d2a33; --muted:#5f6f79; --rule:#cfd8dc;
  --accent:#1f5f8b; --mark:#f2d24b; --plus:#2e7d5b; --minus:#b2473e; --soc:#6b5b95;
  --f-story:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181c; --sheet:#1a2227; --ink:#e3e9ec; --muted:#93a3ad; --rule:#2e3a41;
  --accent:#7fb6dc; --mark:#c9a92c; --plus:#6cc49b; --minus:#e2857b; --soc:#b3a3dd; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181c; --sheet:#1a2227; --ink:#e3e9ec; --muted:#93a3ad; --rule:#2e3a41;
  --accent:#7fb6dc; --mark:#c9a92c; --plus:#6cc49b; --minus:#e2857b; --soc:#b3a3dd; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-story);font-size:1.5rem;margin:0;letter-spacing:.04em}
.tag{font-family:var(--f-num);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.profile{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px;display:grid;gap:12px}
.who{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline}
.age{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1}
.age small{font-size:.8rem;color:var(--muted);margin-left:2px}
.meta{color:var(--muted);font-size:.85rem}
.household{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem}
.household b{font-weight:700}
.household:empty{display:none}
.log li.family{background:color-mix(in srgb,var(--plus) 10%,transparent)}
.status{font-size:.8rem;border:1px solid var(--ink);padding:0 8px}
.sub{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.conds{display:flex;gap:6px;flex-wrap:wrap}
.cond{font-size:.75rem;color:var(--minus);border:1px solid var(--minus);padding:0 7px}
.cond.ok{color:var(--plus);border-color:var(--plus)}
.cond .dots{letter-spacing:1px;font-size:.62rem}
.money{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--rule);padding-top:10px}
.money .big{font-family:var(--f-num);font-size:1.35rem;font-weight:600}
.money .big.neg{color:var(--minus)}
.money .lbl{font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.stat label b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.bar{height:6px;background:var(--rule);margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .4s ease}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--sheet);border:0;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.controls .hint{font-size:.8rem;color:var(--muted);margin-left:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.scene{background:var(--sheet);border:1.5px solid var(--ink);padding:20px;display:grid;gap:14px}
.scene-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.scene-head .yr{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.scene-head h2{font-family:var(--f-story);font-size:1.2rem;margin:0}
.story{font-family:var(--f-story);font-size:1.02rem;line-height:1.95;margin:0}
.echo{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 55%,transparent) 60%)}
.echo-note{display:inline-block;font-family:var(--f-ui);font-size:.72rem;color:var(--accent);border:1px solid var(--accent);padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.q{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:grid;gap:6px;align-content:start;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--rule);padding:11px 13px;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opt:disabled{cursor:default;opacity:.35}
.opt .short{font-size:.72rem;color:var(--minus)}
.opt.picked{opacity:1;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opt .lbl{font-weight:700}
.opt .info{display:block;font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:1px}
.chip{font-family:var(--f-num);font-size:.68rem;padding:0 6px;border:1px solid currentColor;white-space:nowrap}
.chip.p{color:var(--plus)} .chip.m{color:var(--minus)}

.roll{display:grid;gap:8px}
.roll .q{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.why{font-size:.75rem;color:var(--accent)}
.strip{position:relative;display:flex;height:32px;border:1px solid var(--rule)}
.seg{border-right:1px solid var(--sheet);background:color-mix(in srgb,var(--accent) var(--s,20%),var(--sheet));transition:background .3s;min-width:2px}
.seg:last-child{border-right:0}
.seg.hit{background:var(--mark)}
.needle{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);left:0;transform:translateX(-1px)}
.needle::before{content:"";position:absolute;top:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;justify-content:space-between;gap:8px}
.legend .hit{color:var(--ink);font-weight:700}
.outcome{font-family:var(--f-story);font-size:1rem;line-height:1.9;margin:0;border-left:3px solid var(--mark);padding-left:12px}
.next{justify-self:end}

.log h3,.review h3{font-size:.75rem;letter-spacing:.1em;color:var(--muted);margin:0 0 6px;font-weight:500}
.log ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:3.2em 3.6em 1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.log li .a{font-family:var(--f-num);color:var(--muted)}
.log li .t{min-width:0}
.log li .m{font-family:var(--f-num);font-size:.75rem;color:var(--muted);white-space:nowrap;text-align:right}
.log li .m.neg{color:var(--minus)}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-align:center;padding:1px 0;border:1px solid currentColor}
.b-good{color:var(--plus)} .b-normal{color:var(--muted)} .b-bad{color:var(--minus)} .b-soc{color:var(--soc)} .b-fork{color:var(--accent)} .b-life{color:var(--ink)}
.b-slope{color:var(--minus);border-style:dashed} .b-rise{color:var(--plus);border-style:dashed} .b-gray{color:var(--muted);border-color:transparent}
.log li.slope .t{color:var(--minus)}
.opts.one{grid-template-columns:1fr}
.b-rainbow{border:0;color:#fff;background:linear-gradient(90deg,#e0565b,#e8a33d,#5bb26a,#3f88c5,#8a5cc2)}
.log li.rainbow{background:color-mix(in srgb,var(--mark) 18%,transparent)}
.log li.fresh{animation:in .35s ease}
@keyframes in{from{background:color-mix(in srgb,var(--mark) 35%,transparent)}}

.review{display:grid;gap:18px}
.spark{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.spark div{font-size:.75rem;color:var(--muted);min-width:0}
.spark svg{display:block;width:100%;height:40px}
.spark b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.forks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.forks li{font-size:.86rem;display:grid;grid-template-columns:3.2em 1fr;gap:8px}
.forks .a{font-family:var(--f-num);color:var(--muted)}
.forks small{display:block;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.facts div{border-top:1px solid var(--rule);padding-top:6px;font-size:.75rem;color:var(--muted)}
.facts b.neg{color:var(--minus)}
.facts b{display:block;font-family:var(--f-num);font-size:1.05rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>確率人生</h1>
    <span class="tag">demo v3</span>
  </header>

  <section class="profile" aria-label="現在の状態">
    <div class="who"><span class="age" id="age">0<small>歳</small></span><span class="status" id="status">—</span><span class="meta" id="meta"></span></div>
    <div class="stats" id="stats"></div>
    <div class="sub household" id="household"></div>
    <div class="sub"><span id="family">実家：—</span><span class="conds" id="conds"></span></div>
    <div class="money"><span><span class="lbl" id="mlbl">資産 </span><span class="big" id="money">0万円</span><span class="lbl" id="assets" style="display:block"></span></span><span><span class="lbl">年収 </span><span class="num" id="inc">—</span></span></div>
  </section>

  <div class="controls" id="controls">
    <button class="btn" id="play">▶ 自動で進める</button>
    <button class="btn ghost" id="step">1年進める</button>
    <button class="btn ghost" id="speed">速度 ×1</button>
    <span class="hint" id="hint">選択は2〜3年に1回</span>
  </div>

  <section class="scene" id="scene" hidden aria-live="polite"></section>

  <section class="log">
    <h3>年表</h3>
    <ol id="log"></ol>
  </section>
</div>

<script>
/* ========== 基本 ========== */
const STATS=[["health","健康"],["happy","幸福"],["know","知識"],["bond","人間関係"],["luck","運"]];
const SN={...Object.fromEntries(STATS),skill:"熟練"};
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
const $=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function pickW(arr,wf){const ws=arr.map(wf),t=ws.reduce((a,b)=>a+b,0);let r=Math.random()*t;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return i}return arr.length-1}
/* 重み関数：能力値に比例 / 反比例 */
const U=(k,off=0,m=1)=>s=>Math.max(1,(s[k]-off)*m);
const D=(k,m=1)=>s=>Math.max(1,(100-s[k])*m);
const UA=(a,b,off=0,m=1)=>s=>Math.max(1,((s[a]+s[b])/2-off)*m);
const DA=(a,b,m=1)=>s=>Math.max(1,(100-(s[a]+s[b])/2)*m);
const o=(l,w,fx,t,set)=>({l,w,fx:fx||{},t,set});
const man=n=>{const v=Math.round(n);return(v<0?"−":"")+Math.abs(v).toLocaleString("ja-JP")+"万円"};
const echo=t=>t.replace(/\[\[(.+?)\|(.+?)\]\]/g,'<span class="echo">$1</span><span class="echo-note">← $2</span>');
const tx=(t,s)=>typeof t==="function"?t(s):t;

/* ========== 仕事：職種 × 雇用の形・熟練・年収レンジ ========== */
/* 職種と、熟練の伸びに効く能力 */
const JT={sales:{n:"対人・営業",st:["bond","luck"]},service:{n:"接客・飲食",st:["bond","health"]},office:{n:"事務・総合職",st:["know","bond"]},
  tech:{n:"技術・IT",st:["know","luck"]},care:{n:"医療・福祉",st:["bond","health"]},field:{n:"現場・製造",st:["health","know"]},
  research:{n:"研究・専門",st:["know","happy"]},gov:{n:"行政",st:["know","bond"]},founder:{n:"経営・自営",st:["luck","know"]},art:{n:"表現",st:["happy","luck"]},sport:{n:"競技",st:["health","luck"]}};
/* 職種の近さ（転職時に職歴を引き継ぐ率）。書いていない組み合わせは 0.1 */
const NEAR={"sales|service":.6,"sales|office":.4,"sales|care":.2,"sales|founder":.5,"sales|art":.2,"service|office":.3,"service|care":.4,"service|field":.3,
  "service|founder":.4,"service|art":.2,"office|tech":.3,"office|care":.2,"office|field":.2,"office|research":.3,"office|founder":.3,"tech|field":.2,
  "tech|research":.5,"tech|founder":.4,"tech|art":.2,"care|field":.3,"care|research":.2,"care|founder":.2,"care|sport":.2,"field|founder":.2,"field|sport":.2,
  "research|founder":.2,"office|gov":.6,"gov|sales":.2,"gov|care":.2,"gov|research":.2,"research|art":.2,"founder|art":.2,"art|sport":.2};
const near=(a,b)=>a===b?1:NEAR[a+"|"+b]??NEAR[b+"|"+a]??.1;
/* 雇用の形 */
const FORMS={large:"大手",small:"中小",public:"公務",irregular:"非正規",self:"自営"};
/* 年収レンジ [下限, 上限]（万円/年。下限＝入ったばかり、上限＝熟練100）
   出典：厚生労働省「賃金構造基本統計調査」（令和5年）の職種別・企業規模別・雇用形態別の
   きまって支給する現金給与額×12＋年間賞与 を参考にした概算。自営は同調査の対象外のため、
   総務省「就業構造基本調査」の自営業主の所得分布を参考に幅を広くとった。 */
const WAGE={
  sales:   {large:[350,900], small:[300,600], public:[330,650], irregular:[180,300],self:[200,800]},
  service: {large:[300,650], small:[250,450], public:[300,550], irregular:[150,260],self:[180,700]},
  office:  {large:[380,900], small:[300,550], public:[330,750], irregular:[180,300],self:[200,500]},
  tech:    {large:[420,1000],small:[350,700], public:[360,750], irregular:[220,400],self:[250,1000]},
  care:    {large:[350,650], small:[280,480], public:[350,700], irregular:[180,300],self:[220,550]},
  field:   {large:[330,650], small:[270,480], public:[300,550], irregular:[170,280],self:[200,550]},
  gov:     {large:[330,750], small:[330,750], public:[330,750], irregular:[180,300],self:[200,500]},
  research:{large:[450,1100],small:[380,750], public:[400,850], irregular:[220,400],self:[200,900]},
  founder: {large:[400,1500],small:[300,900], public:[330,700], irregular:[200,350],self:[150,1200]},
  art:     {large:[320,800], small:[250,500], public:[300,550], irregular:[120,260],self:[100,1000]},
  sport:   {large:[350,650], small:[300,550], public:[300,550], irregular:[150,280],self:[150,1200]}};
/* 仕事名 → 職種。"=" は今の職種を引き継ぐ（昇進・転職先など）。載っていない名前も引き継ぎ扱い */
const JOB_TYPE={"営業職":"sales","中小企業の営業":"sales",
  "販売員":"service","スポーツ用品店の店員":"service","店舗スタッフ":"service","店舗社員":"service","コンビニ店員":"service","売店スタッフ":"service","アルバイト":"service","パート":"service","パート勤務":"service","短期スタッフ":"service","店主":"service",
  "大手企業 会社員":"office","中小企業 会社員":"office","地元企業 会社員":"office","地元企業の会社員":"office","会社員":"office","中堅企業の会社員":"office","大手メーカー社員":"office",
  "事務職":"office","事務補助":"office","中小企業の事務":"office","地方公務員":"gov","市役所職員":"gov","契約社員":"office","地元の契約社員":"office","派遣社員":"office","嘱託職員":"office","新分野の社員":"office",
  "ITエンジニア":"tech","受託開発エンジニア":"tech","派遣テスター":"tech",
  "医療職":"care","介護職":"care","非常勤職員":"care",
  "工場 正社員":"field","軽作業スタッフ":"field","倉庫の軽作業":"field","ビル清掃":"field","施設清掃":"field","作業所":"field","作業所・アルバイト":"field","在宅データ入力":"field","在宅ワーク":"field",
  "研究者":"research","専門職の会社員":"research",
  "個人事業主":"founder","会社経営者":"founder","共同経営者":"founder","家業":"founder","アプリ会社代表":"founder",
  "所属アーティスト":"art","アルバイト・創作活動":"art","俳優":"art","タレント":"art","作家":"art","配信者":"art",
  "プロ選手":"sport","実業団選手":"sport","コーチ":"sport","コーチ・解説者":"sport",
  "課長":"=","主要部署の管理職":"=","閑職":"=","再就職先":"=","再就職先 社員":"=","転職先の管理職":"=","転職先の社員":"=","転職先の会社員":"=","紹介先の社員":"=","新しい仕事":"=","新規事業担当":"="};
const formOf=(name,kind,prev)=>kind==="public"?"public":kind==="irregular"?"irregular":kind==="founder"||kind==="pro"||kind==="art"?"self":
  /大手|メーカー/.test(name)?"large":prev&&prev.kind==="corp"&&JOB_TYPE[name]==="="?prev.form:"small";
/* 虹ルートの仕事は年収レンジの対象外（道ごとの曲線は後の段階で入れる） */
const isTrackJob=name=>name==="プロ選手"||name==="俳優"||typeof TRACKS!=="undefined"&&Object.values(TRACKS).some(t=>t.chance.hit.job&&t.chance.hit.job.name===name);
const wageAt=(j,sk)=>{const[lo,hi]=WAGE[j.type][j.form];return lo+(hi-lo)*Math.pow(sk/100,1.5)};
function jobInc(j){if(j.legacy)return j.inc;const[lo,hi]=WAGE[j.type][j.form];return Math.round(Math.max(lo*.8,Math.min(hi*1.2,wageAt(j,j.skill)*j.mul)))}
/* 年収に倍率をかける（昇進・評価・不況など）。レンジの仕事は倍率として残す */
function jobMul(s,v){const j=s.job;if(!j)return;if(j.legacy)j.inc*=v;else{j.mul=Math.max(.6,Math.min(1.6,j.mul*v));j.inc=jobInc(j)}}
/* 熟練の初期値：関連能力 × 0.3（30まで）＋ 近い職種の職歴 × 近さ × 0.6 */
const aptOf=(s,type)=>JT[type].st.reduce((a,k)=>a+s[k],0)/JT[type].st.length;
const carryOf=(s,type)=>Math.max(0,...Object.entries(s.exp||{}).map(([k,v])=>v*near(k,type)*.6));
function setJob(s,name,inc,grow,kind,jtype){
  const prev=s.job,code=jtype||JOB_TYPE[name],inherit=code===undefined||code==="=";
  const type=inherit?(prev?prev.type:s.lastType||"office"):code;
  const legacy=isTrackJob(name),form=formOf(name,kind,prev);
  const keep=inherit&&prev&&prev.type===type;
  const skill=keep?prev.skill:Math.min(80,Math.min(30,aptOf(s,type)*.3)+carryOf(s,type));
  s.job={name,inc,grow,kind,type,form,skill,mul:1,legacy};
  if(!legacy&&inc==null)s.job.inc=jobInc(s.job);
  if(!legacy&&inc!=null){const[lo,hi]=WAGE[type][form];s.job.mul=Math.max(.8,Math.min(1.25,Math.max(lo,Math.min(hi,inc))/wageAt(s.job,skill)));s.job.inc=jobInc(s.job)}
  if(!keep)s.jobSince=s.age;s.lastType=type;s.status="work";s.jobs.push(name);if(kind==="pro"&&!s.track&&typeof TRACKS!=="undefined"&&TRACKS.athlete){s.track="athlete";s.trackSince=s.age}}
const SKILL_RATE=3.2;
/* 毎年：熟練が伸びる（伸び ∝ 100−熟練。適性・頑張り・傾きで変わる）。職歴は使わないと少しずつ減る */
const SKILL_STEPS=[[30,"仕事の段取りが、体で分かるようになってきた。"],[60,"職場で頼られることが増えた。"],[90,"この道で、名前を知られるようになった。"]];
function growSkill(){
  const j=s.status==="work"&&s.job;
  for(const k in s.exp)if(!j||k!==j.type)s.exp[k]*=.97;
  if(!j)return;
  if(s.effort&&s.effort.hard&&s.age<=s.effort.until)s.press.tired+=1;   /* がむしゃらの間は疲れがたまる */
  const eff=s.effort&&s.age<=s.effort.until?s.effort.m:1,cm=Math.max(.4,1-.15*(s.cd.tired+s.cd.apathy));
  const b=j.skill;j.skill=Math.min(100,j.skill+SKILL_RATE*(100-j.skill)/100*(.6+aptOf(s,j.type)/125)*eff*cm);
  for(const[v,txt]of SKILL_STEPS)if(b<v&&j.skill>=v)addRow("life","仕事",txt);
  s.exp[j.type]=Math.max(s.exp[j.type]||0,j.skill);s.typeYears[j.type]=(s.typeYears[j.type]||0)+1;
}

/* 候補6つ：夢の職種 ＋ 適性の高い2つ ＋ 残りはランダム（人生ごとに少し変わる） */
function huntCands(mode){
  /* 競技は夢がスポーツか競技経験のある人だけ、転職では選べない */
  const ok=huntTypes(mode).filter(k=>!(mode==="change"&&s.job&&k===s.job.type)&&!(k==="sport"&&(mode==="change"||s.goal!=="sport"&&!s.flags.sport))),out=[];
  const dream=DREAM_TYPE[s.goal];if(dream&&ok.includes(dream))out.push(dream);
  ok.filter(k=>!out.includes(k)).sort((a,b)=>aptOf(s,b)-aptOf(s,a)).slice(0,2).forEach(k=>out.push(k));
  const rest=ok.filter(k=>!out.includes(k));while(out.length<6&&rest.length)out.push(rest.splice(R(0,rest.length-1),1)[0]);
  return out;

  if(r.status&&!r.status.includes(s.status))return false;
  if(r.married!==undefined&&!!s.married!==r.married)return false;
  if(r.kids_min!==undefined&&s.kids<r.kids_min)return false;

  for(const k in r.cond_min||{})if(s.cd[k]<r.cond_min[k])return false;
  for(const k in r.cond_max||{})if(s.cd[k]>r.cond_max[k])return false;
  if(r.parents_alive!==undefined&&s.parentsAlive!==r.parents_alive)return false;
  if(r.goal&&!r.goal.includes(s.goal))return false;
  if(r.year_min!==undefined&&s.year<r.year_min)return false;

  if(r.track&&(s.track!==r.track||s.trackEndKind==="fail"))return false;
  if(r.flags_any&&!r.flags_any.some(f=>s.flags[f]))return false;
  if(r.flags_none&&r.flags_none.some(f=>s.flags[f]))return false;

}

      o("道が開く",()=>Math.max(.5,(av()-c.difficulty)*.45),genFx(c.hit.fx),c.hit.text,()=>{if(c.hit.job)setJob(s,c.hit.job.name,c.hit.job.income,c.hit.job.grow,c.hit.job.kind);s.track=t.id;s.trackSince=s.age;s.rainbow++}),
      o("すれ違う",()=>45+(100-av())*.45,genFx(c.miss.fx),c.miss.text)]}}]};
}
/* 虹ルートの曲線：道ごとの値（実力・人気など）が毎年動き、年収はその値で決まる。低い年が続くと失敗で終わる */
const gauss=sd=>(Math.random()+Math.random()+Math.random()-1.5)*2*sd;
/* 道ごとに curve.start（入った直後の値の基準）、curve.drift（毎年の上乗せ）、curve.sd（ばらつき）で調整できる */
const CURVE_STEP={
  peak: (s,c)=>(s.age<26?4:s.age<30?1:s.age<34?-3:-6)+(s.health-60)/20+gauss(c.sd??4),   /* 20代後半がピーク、30代で衰える */
  buzz: (s,c)=>-3+(s.bond-50)/15+gauss(c.sd??10),                                          /* 人気は上下しながら減っていく */
  grind:(s,c)=>1.5+(s.know-60)/20+gauss(c.sd??3),                                          /* ゆっくり積み上がる */
  swing:(s,c)=>(s.luck-50)/10+gauss(c.sd??12)};                                            /* 振れ幅が大きい */
const TRACK_FAIL_LINE=25,TRACK_FAIL_YEARS=2,BOOM_RATE=.05;
const onCurve=x=>!!(x.track&&TRACKS[x.track]&&TRACKS[x.track].curve&&!x.trackEnded&&x.tv!==undefined);
function trackCurve(){
  const t=TRACKS[s.track];if(!t||!t.curve||s.trackEnded)return;
  const c=t.curve,hit=t.chance.hit.job;
  if(s.tv!==undefined&&!(s.status==="work"&&s.job&&s.job.legacy)){s.trackEnded=1;s.trackEndKind="end";s.trackEndAge=s.age;return}
  if(s.tv===undefined){s.tv=Math.max(10,Math.min(90,(c.start??40)+(avgOf(s,t.chance.stats)-50)/2));s.tvLow=0;return}
  let d=CURVE_STEP[c.type](s,c)+(c.drift||0);
  if(c.type==="buzz"&&Math.random()<BOOM_RATE){d+=20;addRow("rainbow","★ ブーム","急に名前が知られるようになった。街で声をかけられた。")}
  s.tv=Math.max(0,Math.min(100,s.tv+d));s.tvMax=Math.max(s.tvMax||0,s.tv);if(s.tv>=(s.tvPeak||0)){s.tvPeak=s.tv;s.tvPeakAge=s.age}
  if(hit&&s.job&&s.job.legacy)s.job.inc=Math.round(hit.income*(.4+s.tv/60));
  s.tvLow=s.tv<TRACK_FAIL_LINE?s.tvLow+1:0;
  if(s.tvLow>=TRACK_FAIL_YEARS){
    s.trackEnded=1;s.trackEndKind="fail";s.trackEndAge=s.age;
    if(s.job)s.exp[s.job.type]=Math.max(s.exp[s.job.type]||0,s.tv);
    const f=c.fail;addRow("life","区切り",f.text,f.money?{money:f.money}:null);if(f.money)s.money+=f.money;
    if(f.job)setJob(s,f.job.name,f.job.income,f.job.grow,f.job.kind,f.job.type);else{s.status="jobless";s.job=null}
    s.happy=clamp(s.happy-6);s.press.apathy+=2;
  }
}
function trackEnd(){
  const t=TRACKS[s.track];if(!t||!t.end||s.trackEnded)return;
  const a=t.end.age;if(s.age<a[0])return;
  if(s.age>=a[1]||Math.random()<.3){s.trackEnded=1;s.trackEndKind="end";s.trackEndAge=s.age;addRow("life","区切り",t.end.text);if(t.end.job)setJob(s,t.end.job.name,t.end.job.income,t.end.job.grow,t.end.job.kind)}
}

/* ========== 1年の処理 ========== */
function applyFx(fx){for(const k in fx){const v=fx[k];
  if(k==="money")s.money+=v;else if(k==="incMul")jobMul(s,v);else s[k]=clamp(s[k]+v)}}
const totalLv=()=>s.cd.iso+s.cd.tired+s.cd.poor+s.cd.apathy;
/* 虹の兆しが出る年あたりの基準確率（運が高いほど上がる） */
const RAINBOW_RATE=.02;
function tierOf(){const l=(s.luck-50)/100,sl=totalLv()*.025;
  const rb=RAINBOW_RATE*(0.4+s.luck/83),good=Math.max(.1,.35+l*.2-sl),normal=.4;const r=Math.random();
  if(r<rb)return"rainbow";if(r<rb+good)return"good";if(r<rb+good+normal)return"normal";return"bad"}
function stageKey(){const st=s.status;
  if(st==="hikikomori"||st==="futoko")return"hiki";
  if(s.age<=12)return"child";if(s.age<=18&&st==="school")return"teen";if(s.age>=62)return"senior";return"adult"}
const used=new Set();
function yearlyEvent(){
  let tier=tierOf();
  if(tier==="rainbow"){
    const ts=(GEN.tracks||[]).filter(gateOk);
    if(ts.length){s.pendingRainbow=ts[R(0,ts.length-1)];addRow("rainbow","★ 虹","何かが起こりそうな予感がする。");return}
    tier="good"}
  /* 無気力が深いと、何も起きない灰色の年が混ざる */
  if(tier!=="bad"&&s.cd.apathy>=2&&Math.random()<.4){applyFx({know:-1});addRow("gray","—","特に何もない一年だった。",{know:-1});return}
  /* 生成イベント（年齢・状態・支出の条件つき） */
  let g=GEN.events.filter(x=>x.tier===tier&&genEligible(x));
  if(g.length){
    const tr=g.filter(x=>x.requires&&x.requires.track);
    if(tr.length&&Math.random()<.5)g=tr;
    let cand=g.filter(x=>!used.has(x.id));if(!cand.length)cand=g;
    const x=cand[R(0,cand.length-1)];used.add(x.id);
    const fx=genFx(x.fx);applyFx(fx);applySet(x.set);
    if(tier==="bad")for(const k in fx)if(fx[k]<0&&PRESS_MAP[k])s.press[PRESS_MAP[k]]+=1.5;
    addRow(tier,tier,fill(x.text),fx);return}
  const pool=POOL[stageKey()][tier].filter(e=>(!e[2]||e[2](s))&&!(tier!=="bad"&&e[1].money<0&&(s.money<-e[1].money*3||s.cd.poor>0)));
  if(!pool.length){addRow("gray","—","特に何もない一年だった。");return}
  let cand=pool.filter(e=>!used.has(e[0]));if(!cand.length)cand=pool;
  const e=cand[R(0,cand.length-1)];used.add(e[0]);
  applyFx(e[1]);if(e[3])e[3](s);
  if(tier==="bad")for(const k in e[1])if(e[1][k]<0&&PRESS_MAP[k])s.press[PRESS_MAP[k]]+=1.5;
  addRow(tier,{good:"good",normal:"normal",bad:"bad"}[tier],e[0],e[1]);
}
/* 家計の基準（万円/年）：手取り率、生活費（単身の上限・下限、実家、配偶者、子ども1人あたり）
   働いている人の単身の生活費は、手取りに合わせて下限〜上限のあいだで縮む（収入が低ければ切り詰める） */
const ECON={take:.82,live:225,liveMin:130,adapt:.95,liveHome:140,kid:50};
/* 子どもの年齢：s.kids の増減に合わせて生まれた年を記録し、22歳になるまでを養育費の対象にする */
/* ========== 子ども ==========
   育ち（0〜100）は毎年、夫婦の愛情・親の幸福・家計で動く。12歳で教育の分岐（資産があれば私立・塾）。
   22歳で育ちに応じて独立のしかたが決まり、そのあと結婚して孫が生まれることがある */
const KID={start:[45,55],drift:-.6,eliteBoost:1,eliteMin:800,eliteCost:250,eliteYearly:60,stayUntil:30,marryRate:.07,grandRate:.12,grandMax:2};
function syncKids(){s.kidList=s.kidList||[];while(s.kidList.length<s.kids)s.kidList.push({born:s.age,grow:R(...KID.start),edu:null,path:null,married:false,grand:0});
  while(s.kidList.length>s.kids)s.kidList.pop();s.kidBorn=s.kidList.map(k=>k.born)}
const kidAge=k=>s.age-k.born;
const kidHome=k=>kidAge(k)<22||k.path==="stay"&&kidAge(k)<KID.stayUntil;
const kidsAtHome=()=>{syncKids();return s.kidList.filter(kidHome).length};
const eliteAtHome=()=>s.kidList?s.kidList.filter(k=>k.edu==="elite"&&kidAge(k)<22).length:0;
const kidName=(i,n)=>n>1?["上の子","下の子","末の子"][Math.min(i,2)]:"子ども";
function kidYear(){
  syncKids();const n=s.kidList.length;
  s.kidList.forEach((k,i)=>{const a=kidAge(k),who=kidName(i,n);
    if(a>0&&a<22){
      const home=s.married&&s.partner?(s.partner.love-60)/45:s.flags.divorced?-.4:-.2;   /* 夫婦の仲（ひとり親は少し不利） */
      k.grow=Math.max(0,Math.min(100,k.grow+KID.drift+home+(s.happy-55)/40-(s.cd.poor>=1?1:0)-(s.cd.poor>=2?1:0)+(k.edu==="elite"?KID.eliteBoost:0)+gauss(5)));
    }
    if(a===22){
      k.path=k.grow>=75?"big":k.grow>=28?"local":"stay";
      addRow("life","家族",{big:`${who}が家を出た。名前を聞けば誰もが知る会社に就職した。`,local:`${who}が家を出た。地元の会社に就職した。部屋が急に広くなった。`,stay:`${who}は、しばらく家にいることになった。`}[k.path]);
      if(k.path==="big")s.happy=clamp(s.happy+3);
    }
    if(k.path==="stay"&&a===KID.stayUntil){addRow("life","家族",`${who}が、ようやく家を出た。`)}
    if(a>=25&&a<=40&&!k.married&&k.path!=="stay"&&Math.random()<KID.marryRate*(.6+k.grow/125)){k.married=true;addRow("life","家族",`${who}が結婚した。式で、少しだけ泣いた。`,{happy:4});s.happy=clamp(s.happy+4)}
    if(k.married&&k.grand<KID.grandMax&&a<=42&&Math.random()<KID.grandRate){k.grand++;s.grandkids=(s.grandkids||0)+1;addRow("life","家族",s.grandkids===1?"孫が生まれた。小さな手が、指を握った。":"また孫が生まれた。",{happy:4,bond:2});s.happy=clamp(s.happy+4);s.bond=clamp(s.bond+2)}
  });
}

function kidDecision(){syncKids();const n=s.kidList.length;
  for(let i=0;i<n;i++){const k=s.kidList[i];if(kidAge(k)===12&&!k.eduAsked){k.eduAsked=1;return eduDecision(k,kidName(i,n))}}return null}
/* ========== パートナー ==========
   結婚した年に、パートナーの年収を自分の年収の近くから1回だけ決める（年収の近い人どうしが結婚しやすい）。
   愛情（0〜100）は毎年、人間関係・幸福・傾きで動き、低い年が続くと離婚が起きることがある */
const PARTNER={workRate:.75,spread:.35,minInc:120,maxInc:1500,retireAge:65,pension:70,live:80,kidShareAfterDivorce:.6};  /* 離婚後の養育費は元パートナーと分担 */
const LOVE={start:[60,80],line:25,divorceP:.35};
function makePartner(){
  const own=s.job?s.job.inc:250,works=Math.random()<PARTNER.workRate;
  s.partner={works,inc:works?Math.round(Math.max(PARTNER.minInc,Math.min(PARTNER.maxInc,own*Math.exp(gauss(PARTNER.spread))))):0,love:R(...LOVE.start),since:s.age};
}
const loveAdd=(s,v)=>{if(s.partner)s.partner.love=Math.max(0,Math.min(100,s.partner.love+v))};
function divorce(s,text){
  s.married=false;s.partner=null;s.flags.divorced=1;s.divorces=(s.divorces||0)+1;
  if(s.money>0)s.money=Math.round(s.money/2);   /* 財産分与 */
  s.happy=clamp(s.happy-8);s.press.iso+=2;
  if(text)addRow("life","離婚",text);
}
function partnerYear(){
  if(!s.married){s.partner=null;return}           /* 死別・離婚の分岐で独身に戻った */
  if(!s.partner){makePartner();return}
  const p=s.partner;
  loveAdd(s,-3.2+(s.bond-50)/15+(s.happy-50)/25-(s.cd.poor>=2?3:0)-(s.cd.tired>=2?2:0)+gauss(4));
  if(p.love<LOVE.line&&Math.random()<LOVE.divorceP)divorce(s,"話し合いの末、別々の道を歩くことにした。");
}
const partnerNet=()=>!s.partner?0:s.age<PARTNER.retireAge?(s.partner.works?s.partner.inc*ECON.take:0):PARTNER.pension;
/* 自己破産から7年間は借りられないので、資産はマイナスにならない。足りない分は生活を切り詰める（幸福が下がる） */
function noBorrow(){if(s.flags.bankrupt&&s.money<0){const lack=-s.money;s.money=0;s.happy=clamp(s.happy-Math.min(4,1+lack/100))}}
/* ========== 資産 ==========
   現金（s.money）とは別に、家・株・土地・ビルを持つ。純資産 = 現金 + 資産の評価額 − ローン残高。
   現金がマイナスになると、株→ビル→土地の順に売って埋める（家は自己破産のときだけ手放す） */
const ASSET={names:{house:"家",stock:"株",risky:"個別株",land:"土地",building:"ビル"},
  house:{price:2500,loan:2200,dep:.015,floor:.5},stock:{mu:.04,sd:.16,div:.015},risky:{mu:.02,sd:.4,div:0},
  land:{mu:.005,sd:.03},building:{mu:.005,sd:.06,rent:.05}};
const assetsOf=()=>s.assets||(s.assets=[]);
const netWorth=()=>s.money+assetsOf().reduce((a,x)=>a+x.v-(x.loan||0),0);
function addAsset(k,v,extra){assetsOf().push({k,v:Math.round(v),since:s.age,...extra})}
function assetYear(){
  const A=assetsOf();
  if(s.flags.house&&!A.some(x=>x.k==="house"))addAsset("house",ASSET.house.price,{loan:ASSET.house.loan});
  if(!s.flags.house)s.assets=A.filter(x=>x.k!=="house");
  for(const x of assetsOf()){
    if(x.k==="house"){x.v=Math.max(ASSET.house.price*ASSET.house.floor,x.v*(1-ASSET.house.dep));if(s.age<66)x.loan=Math.max(0,(x.loan||0)-70)}
    else{const c=ASSET[x.k];x.v=Math.max(0,x.v*Math.exp(c.mu+gauss(c.sd)));
      if(c.div)s.money+=x.v*c.div;if(c.rent)s.money+=x.v*c.rent}

/* ========== 病気 ==========

  const tr=s.treat||0;
  if(s.ill<3&&Math.random()<ILL.worsen[s.ill]*h*(s.age>70?1.3:1)){s.ill++;addRow("slope","病気",ILL_TXT[s.ill]);if(s.ill===3)s.illAsk=1}
  else if(Math.random()<ILL.recover[s.ill]*(.5+s.health/100)*(1+tr*.5)){s.ill--;addRow("rise","回復",s.ill?ILL_TXT.down:ILL_TXT.cured);if(!s.ill)s.treat=0}

/* 大きな病気になった年は、治療方針の分岐を必ず出す */

function snap(){const nw=netWorth();s.hist.push({age:s.age,health:s.health,happy:s.happy,know:s.know,bond:s.bond,luck:s.luck,money:nw});s.peak=Math.max(s.peak,nw);s.minMoney=Math.min(s.minMoney,nw);s.slopeMax=Math.max(s.slopeMax,...Object.values(s.cd))}

/* 分岐の決め方：

function eligible(p){return s.age>=p.min&&s.age<=p.max&&(!p.cond||p.cond(s))&&(s.decUsed[p.id]===undefined||(p.prio&&s.age-s.decUsed[p.id]>=8))}

const pick=a=>a[R(0,a.length-1)];
/* 会社員前提の汎用分岐（workDecision / genericLife）を出さない人：虹ルート、プロ・表現者・経営者 */
const special=()=>!!s.track&&s.trackEndKind!=="fail"||!!(s.job&&["pro","art","founder"].includes(s.job.kind));

const FAMILY=Object.fromEntries((GEN.decisions||[]).flatMap(x=>{const ss=x.choices.flatMap(c=>["good","mid","bad"].map(k=>c.roll[k].set||{}));

const HAND=[[6,6,7],[9,8,10],[13,13,14],[16,16,17],[20,19,21],[25,24,27],[28,26,32,()=>!s.married],[31,30,33],[34,29,40],

/* 候補の選び方：まず題材の種類を均等に（直前と同じ種類は半分、結婚・子どもは FAMILY_W 倍）、その中で年齢の幅が残り少ないものほど重く */
const FAMILY_W=3;
function pickCand(c){

  if(!ks.length){const g=c.filter(x=>x.cat==="generic");return g.length?pick(g):null}
  const k=ks[pickW(ks,k=>k==="family"?FAMILY_W:k===s.lastCat?.5:1)];s.lastCat=k;
  const xs=cats[k];return xs[pickW(xs,x=>1/(Math.max(0,x.max-s.age)+1))];

function nextDecision(){

  {const kd=illDecision()||kidDecision();if(kd)return kd}

function step(){
  if(pending||!s.alive)return;
  s.age++;s.year++;
  passive();illnessYear();marryCheck();birthCheck();if(s.status!=="work")growSkill();econ();
  const soc=SOCIETY[s.year];if(soc){const extra=soc[1](s);addRow("soc","社会",soc[0]+(extra?" "+extra:""))}
  yearlyEvent();
  updateConds();trackCurve();trackEnd();noBorrow();
  if(deathCheck()){die();return}
  snap();render();
  const d=nextDecision();if(d){s.lastDec=s.age;s.nextGap=Math.random()<.5?2:3;showDecision(d);return}
  if(auto)timer=setTimeout(step,SPEED[speed]);
}

/* ========== 表示 ========== */
function chips(fx){
  const out=[];for(const k in fx){const v=fx[k];if(!v)continue;
    if(k==="money")out.push(`<span class="chip ${v>0?"p":"m"}">資産 ${v>0?"+":""}${man(v)}</span>`);
    else if(k==="incMul"){if(v!==1)out.push(`<span class="chip ${v>1?"p":"m"}">年収 ×${v.toFixed(2)}</span>`)}
    else out.push(`<span class="chip ${v>0?"p":"m"}">${SN[k]} ${v>0?"+":"−"}${Math.abs(v)}</span>`)}
  return out.length?` <span class="chips">${out.join("")}</span>`:"";
}
function addRow(kind,label,text,fx){
  const li=document.createElement("li");li.className="fresh"+(kind==="rainbow"?" rainbow":kind==="slope"?" slope":["誕生","結婚","離婚","家族"].includes(label)&&s.age>0?" family":"");
  li.innerHTML=`<span class="a">${s.age}歳</span><span class="badge b-${kind}">${label}</span><span class="t">${echo(text)}${fx?chips(fx):""}</span><span class="m${netWorth()<0?" neg":""}">${man(netWorth())}</span>`;
  $("log").prepend(li);
}
function statusLabel(){const st=s.status,a=s.age;
  if(st==="school")return a<6?"未就学":s.flags.tsushin&&a>=15?"通信制・高校生":a<=12?(s.flags.private?"私立小学生":"小学生"):a<=15?"中学生":"高校生";
  if(st==="futoko")return"不登校";if(st==="hikikomori")return"ひきこもり";
  if(st==="college")return s.flags.senmon?"専門学校生":"大学生";
  if(st==="work")return s.job.name;if(st==="jobless")return"無職";if(st==="retired")return"引退";return"—"}
/* 家族の行：配偶者・子ども・孫 */
const growLabel=g=>g>=75?"すくすく":g>=45?"ふつう":g>=28?"少し心配":"心配";
function householdHTML(){
  const out=[];
  if(s.married&&s.partner)out.push(`<span>配偶者 <b>愛情${Math.round(s.partner.love)}</b>・${s.partner.works?`共働き（年収${man(s.partner.inc)}）`:"専業"}</span>`);
  else if(s.married)out.push("<span>配偶者 <b>あり</b></span>");
  else if(s.flags.divorced)out.push("<span>配偶者 <b>なし</b>（離婚）</span>");
  if(s.kids){syncKids();const n=s.kidList.length;
    out.push("<span>子ども "+s.kidList.map((k,i)=>`<b>${kidName(i,n)} ${kidAge(k)}歳</b>${kidAge(k)<22?`（${growLabel(k.grow)}${k.edu==="elite"?"・私立":""}）`:k.married?"（既婚）":k.path==="stay"&&kidHome(k)?"（実家）":"（独立）"}`).join("・")+"</span>")}
  if(s.grandkids)out.push(`<span>孫 <b>${s.grandkids}人</b></span>`);
  return out.join("");
}
function render(){
  $("age").innerHTML=`${s.age}<small>歳</small>`;$("status").textContent=statusLabel();
  $("meta").textContent=`${s.year}年 · ${s.pref}`+(s.goal?` · 夢：${GOALS[s.goal]}`:"")+(s.track&&TRACKS[s.track]?` · ★${TRACKS[s.track].name}`+(onCurve(s)?` ${TRACKS[s.track].curve.label}${Math.round(s.tv)}`:""):"")+(s.job&&!s.job.legacy?` · ${JT[s.job.type].n} 熟練${s.skill}`:"")+(s.flags.bankrupt?" · 自己破産から再出発中":"");
  $("household").innerHTML=householdHTML();
  $("stats").innerHTML=STATS.map(([k,n])=>`<div class="stat"><label>${n}<b>${s[k]}</b></label><div class="bar"><i style="width:${s[k]}%"></i></div></div>`).join("");
  const nw=netWorth(),m=$("money");m.textContent=man(nw);m.classList.toggle("neg",nw<0);$("assets").textContent=assetLine();
  $("mlbl").textContent=s.age<22&&s.status!=="work"?"資産（親の教育資金を含む） ":"資産 ";
  $("inc").textContent=s.job?man(s.job.inc):s.status==="retired"?`年金 ${man(s.pension||0)}`:"—";
  $("family").textContent=s.parent?`実家：世帯年収 ${FAM[s.fam][0]}・${s.parent}`:"実家：—";
  const cs=Object.keys(CONDS).filter(k=>s.cd[k]>0);
  const ill=s.ill?`<span class="cond">${ILL.names[s.ill]} <span class="dots">${"●".repeat(s.ill)}${"○".repeat(3-s.ill)}</span></span>`:"";
  $("conds").innerHTML=ill+(cs.length?cs.map(k=>`<span class="cond">${CONDS[k].n} <span class="dots">${"●".repeat(s.cd[k])}${"○".repeat(3-s.cd[k])}</span></span>`).join(""):ill?"":`<span class="cond ok">状態：良好</span>`);
}
function setAuto(v){auto=v;clearTimeout(timer);$("play").textContent=auto?"❚❚ 一時停止":"▶ 自動で進める";if(auto&&!pending)timer=setTimeout(step,300)}
$("play").onclick=()=>{if(!s.alive)return newLife();setAuto(!auto)};
$("step").onclick=()=>{if(!s.alive)return;setAuto(false);step()};
$("speed").onclick=()=>{speed=speed===1?2:speed===2?4:1;$("speed").textContent=`速度 ×${speed}`};

/* ========== 分岐カード ========== */
function showDecision(d){
  pending=true;clearTimeout(timer);
  const need=c=>(c.cost||0)+Math.max(0,-((c.fx||{}).money||0));
  let off=d.choices.map(c=>need(c)>0&&s.money<need(c));if(off.every(Boolean))off=off.map(()=>false);
  const sc=$("scene");sc.hidden=false;
  sc.innerHTML=`<div class="scene-head"><span class="yr">${s.year}年 · ${s.age}歳</span><h2>${d.title}</h2></div>
   <p class="story">${echo(tx(d.text,s))}</p>
   <span class="q">選択</span><div class="opts${d.choices.length===1?" one":""}" id="opts">${d.choices.map((c,i)=>`<button class="opt" data-i="${i}"${off[i]?" disabled":""}><span class="lbl">${c.l}</span>${c.info?`<span class="info">${c.info}</span>`:""}${chips(Object.assign({},c.cost?{money:-c.cost}:{},c.fx||{}))}${off[i]?'<span class="short">資金が足りない</span>':""}</button>`).join("")}</div>
   <div id="slot"></div>`;
  sc.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    sc.querySelectorAll(".opt").forEach(x=>{x.disabled=true;x.classList.add("done")});b.classList.add("picked");
    const c=d.choices[+b.dataset.i];if(c.cost)s.money-=c.cost;applyFx(c.fx||{});if(c.set)c.set(s);render();roll(d,c,c.roll)});
  sc.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
}
/* ルーレットの並び：左が悪い結果、右が良い結果。生成分岐は good/mid/bad の順位、手書きは効果の大きさで並べる
   （効果がすべて同じなら書かれた順のまま。表示の順番だけで、確率は変わらない） */
const outcomeScore=x=>{let v=0;for(const k in x.fx||{}){const a=x.fx[k];v+=k==="money"?a/20:k==="incMul"?(a-1)*100:a}return v};
function dispOrder(os){
  const idx=os.map((_,i)=>i);
  if(os.every(x=>x.rank!==undefined))return idx.sort((a,b)=>os[a].rank-os[b].rank);
  const sc=os.map(outcomeScore);if(sc.every(v=>v===sc[0]))return idx;
  return idx.sort((a,b)=>sc[a]-sc[b]||b-a);
}
function roll(d,c,r){
  const ws=r.o.map(x=>Math.max(.5,typeof x.w==="function"?x.w(s):x.w)),tot=ws.reduce((a,b)=>a+b,0);
  const ps=ws.map(w=>w/tot*100),res=pickW(ws,x=>x),ord=dispOrder(r.o),pos=ord.indexOf(res);
  const why=r.note||("影響："+(r.why||[]).map(k=>`${SN[k]} ${s[k]}`).join("・")),e=era(s);
  const box=document.createElement("div");box.className="roll";
  box.innerHTML=`<span class="q"><span>${r.q}</span><span class="why">${why}${r.era&&e.n?` ／ 時代：${e.n}`:""}</span></span>
   <div class="strip">${ord.map((i,j)=>`<div class="seg" style="width:${ps[i]}%;--s:${10+(j*60/Math.max(1,ps.length-1))|0}%"></div>`).join("")}<div class="needle"></div></div>
   <div class="legend">${ord.map(i=>`<span><span>${r.o[i].l}</span><b class="num">${ps[i]<1?"<1":Math.round(ps[i])}%</b></span>`).join("")}</div>`;
  $("slot").appendChild(box);
  let st=0;for(let j=0;j<pos;j++)st+=ps[ord[j]];const target=st+ps[res]*(.2+Math.random()*.6);
  const nd=box.querySelector(".needle"),Dur=reduce?0:1600/Math.sqrt(speed),S=400+target,t0=performance.now();
  const tri=v=>{const m=v%200;return m<100?m:200-m};
  (function f(t){const k=Dur?Math.min(1,(t-t0)/Dur):1,ez=1-Math.pow(1-k,3);nd.style.left=tri(S*ez)+"%";if(k<1)requestAnimationFrame(f);else land(d,c,r,box,res,ps,pos)})(t0);
}
function land(d,c,r,box,res,ps,pos){
  const x=r.o[res];
  box.querySelectorAll(".seg")[pos].classList.add("hit");box.querySelectorAll(".legend > span")[pos].classList.add("hit");
  applyFx(x.fx);if(x.set)x.set(s);
  const out=document.createElement("p");out.className="outcome";out.innerHTML=echo(tx(x.t,s)||x.l)+chips(x.fx);box.appendChild(out);
  const pr=ps[res]<1?"<1":Math.round(ps[res]);
  if(d.rainbow){addRow("rainbow","★ 虹",`${r.q}：${x.l}（${pr}%）`)}
  else if(d.birth){addRow("life","誕生",`${r.q}：${x.l}（${pr}%）`)}
  else{s.forks.push({age:s.age,title:d.title,choice:c.l,res:x.l,p:pr,q:r.q});
    addRow("fork","分岐",`${d.title}：${c.l} → ${x.l}（${pr}%）`);}
  render();
  if(r===c.roll&&c.then){setTimeout(()=>roll(d,c,c.then(s)),reduce?0:500);return}
  snap();
  const nb=document.createElement("button");nb.className="btn next";nb.textContent=d.birth?"人生をはじめる":"続ける";
  nb.onclick=()=>{pending=false;if(afterDecision())return;$("scene").hidden=true;if(d.birth&&!auto)setAuto(true);else if(auto)timer=setTimeout(step,400);};
  box.appendChild(nb);nb.focus({preventScroll:true});
}

/* ========== 死と振り返り ========== */
/* 最も長く続けた職種 */
function kidStory(){const g=s.grandkids||0;return g?`孫は${g}人。`:""}
function longestType(){const e=Object.entries(s.typeYears||{}).sort((a,b)=>b[1]-a[1])[0];return e?`最も長く続けた職種は${JT[e[0]].n}（${e[1]}年・熟練${Math.round(s.exp[e[0]]||0)}）。`:""}
function die(){
  s.alive=false;setAuto(false);snap();render();
  const cause=s.deathCause==="accident"?"思いがけない事故で":s.deathCause==="ill"?(s.age-(s.illSince||s.age)>=5?"長い闘病の末に":"病気で"):s.age>=90?"眠るように":"静かに";
  addRow("life","死",`${s.year}年、${s.age}歳で${cause}息を引き取った。`);
  const career=s.hikiYears>=10?"長い時間を部屋の中で過ごし":s.jobs.length?`${s.jobs.includes("プロ選手")?"プロ選手として活躍し":[...new Set(s.jobs)].slice(-2).join("、") + "として働き"}`:"働くことはなく";
  const sc=$("scene");sc.hidden=false;$("controls").hidden=true;
  sc.innerHTML=`<div class="scene-head"><span class="yr">${s.birthYear}–${s.year}</span><h2>ある人生の記録</h2></div>
   <p class="story">${s.pref}の${s.parent}（世帯年収${FAM[s.fam][0]}）に生まれ、${career}、${s.age}歳で亡くなった。${s.married?"結婚し":s.flags.divorced?"離婚を経験し":"結婚はせず"}、${s.kids?`子どもを${s.kids}人育てた。${kidStory()}`:"子どもはいなかった。"}${longestType()}${s.track&&TRACKS[s.track]?`★${TRACKS[s.track].name}の道を${s.trackSince}歳から歩いた。`:""}${s.bankruptAge?`${s.bankruptAge}歳で自己破産し、そこから立て直した。`:""}</p>
   <div class="review">
    <div class="facts">
      <div>最終資産<b class="${netWorth()<0?"neg":""}">${man(netWorth())}</b></div>
      <div>最大資産<b>${man(s.peak)}</b></div>${assetLine()?`<div>内訳<b style="font-size:.8rem">${assetLine()}</b></div>`:""}
      <div>虹イベント<b>${s.rainbow}回</b></div>
      <div>分岐<b>${s.forks.length}回</b></div>
      <div>最も深い傾き<b>${s.slopeMax}／3</b></div>
    </div>
    <div><h3>パラメータの推移</h3><div class="spark">${STATS.map(([k,n])=>`<div>${n} <b>${s[k]}</b>${spark(k)}</div>`).join("")}<div>資産 <b>${man(s.money)}</b>${spark("money")}</div></div></div>
    <div><h3>分岐点</h3><ul class="forks">${s.forks.map(l=>`<li><span class="a">${l.age}歳</span><span>${l.title}：${l.choice}<small>${l.q}：${l.p}%の「${l.res}」を引いた</small></span></li>`).join("")}</ul></div>
    <button class="btn" id="again" style="justify-self:start">もう一度生まれる</button>
   </div>`;
  $("again").onclick=()=>{newLife();window.scrollTo({top:0})};
}
function spark(k){
  const h=s.hist,mx=Math.max(...h.map(x=>x.age),1);
  let lo=0,hi=100;if(k==="money"){lo=Math.min(...h.map(x=>x.money),0);hi=Math.max(...h.map(x=>x.money),1)}
  const y=v=>(37-(v-lo)/(hi-lo||1)*34).toFixed(1);
  const pts=h.map(x=>`${(x.age/mx*100).toFixed(1)},${y(x[k])}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  const zero=k==="money"&&lo<0?`<line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--minus)" stroke-width="0.6" stroke-dasharray="2 2"/>`:"";
  return`<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">${zero}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="1.8" fill="var(--accent)"/></svg>`;
}

newLife();
</script>
