<title>確率人生 デモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 統計年鑑の一頁。上に人生のパラメータ、中央に分岐カード、下に新しい年が上に積まれる年表 */
:root{
  --paper:#eef1f2; --sheet:#fbfcfc; --ink:#1d2a33; --muted:#5f6f79; --rule:#cfd8dc;
  --accent:#1f5f8b; --mark:#f2d24b; --plus:#2e7d5b; --minus:#b2473e; --soc:#6b5b95;
  --f-story:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181c; --sheet:#1a2227; --ink:#e3e9ec; --muted:#93a3ad; --rule:#2e3a41;
  --accent:#7fb6dc; --mark:#c9a92c; --plus:#6cc49b; --minus:#e2857b; --soc:#b3a3dd; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181c; --sheet:#1a2227; --ink:#e3e9ec; --muted:#93a3ad; --rule:#2e3a41;
  --accent:#7fb6dc; --mark:#c9a92c; --plus:#6cc49b; --minus:#e2857b; --soc:#b3a3dd; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-story);font-size:1.5rem;margin:0;letter-spacing:.04em}
.tag{font-family:var(--f-num);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.profile{background:var(--sheet);border:1px solid var(--rule);padding:14px 16px;display:grid;gap:12px}
.who{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline}
.age{font-family:var(--f-num);font-size:2rem;font-weight:600;line-height:1}
.age small{font-size:.8rem;color:var(--muted);margin-left:2px}
.meta{color:var(--muted);font-size:.85rem}
.status{font-size:.8rem;border:1px solid var(--ink);padding:0 8px}
.sub{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.conds{display:flex;gap:6px;flex-wrap:wrap}
.cond{font-size:.75rem;color:var(--minus);border:1px solid var(--minus);padding:0 7px}
.cond.ok{color:var(--plus);border-color:var(--plus)}
.cond .dots{letter-spacing:1px;font-size:.62rem}
.money{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:baseline;border-top:1px solid var(--rule);padding-top:10px}
.money .big{font-family:var(--f-num);font-size:1.35rem;font-weight:600}
.money .big.neg{color:var(--minus)}
.money .lbl{font-size:.75rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:480px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat label{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.stat label b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
.bar{height:6px;background:var(--rule);margin-top:3px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .4s ease}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:var(--sheet);border:0;padding:9px 16px;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.controls .hint{font-size:.8rem;color:var(--muted);margin-left:auto}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.scene{background:var(--sheet);border:1.5px solid var(--ink);padding:20px;display:grid;gap:14px}
.scene-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.scene-head .yr{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.scene-head h2{font-family:var(--f-story);font-size:1.2rem;margin:0}
.story{font-family:var(--f-story);font-size:1.02rem;line-height:1.95;margin:0}
.echo{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mark) 55%,transparent) 60%)}
.echo-note{display:inline-block;font-family:var(--f-ui);font-size:.72rem;color:var(--accent);border:1px solid var(--accent);padding:0 6px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.q{font-size:.75rem;color:var(--muted);letter-spacing:.06em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{display:grid;gap:6px;align-content:start;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--rule);padding:11px 13px;transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opt:disabled{cursor:default;opacity:.35}
.opt .short{font-size:.72rem;color:var(--minus)}
.opt.picked{opacity:1;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.opt .lbl{font-weight:700}
.chips{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:1px}
.chip{font-family:var(--f-num);font-size:.68rem;padding:0 6px;border:1px solid currentColor;white-space:nowrap}
.chip.p{color:var(--plus)} .chip.m{color:var(--minus)}

.roll{display:grid;gap:8px}
.roll .q{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.why{font-size:.75rem;color:var(--accent)}
.strip{position:relative;display:flex;height:32px;border:1px solid var(--rule)}
.seg{border-right:1px solid var(--sheet);background:color-mix(in srgb,var(--accent) var(--s,20%),var(--sheet));transition:background .3s;min-width:2px}
.seg:last-child{border-right:0}
.seg.hit{background:var(--mark)}
.needle{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);left:0;transform:translateX(-1px)}
.needle::before{content:"";position:absolute;top:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:flex;justify-content:space-between;gap:8px}
.legend .hit{color:var(--ink);font-weight:700}
.outcome{font-family:var(--f-story);font-size:1rem;line-height:1.9;margin:0;border-left:3px solid var(--mark);padding-left:12px}
.next{justify-self:end}

.log h3,.review h3{font-size:.75rem;letter-spacing:.1em;color:var(--muted);margin:0 0 6px;font-weight:500}
.log ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:3.2em 3.6em 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:.88rem;align-items:baseline}
.log li .a{font-family:var(--f-num);color:var(--muted)}
.log li .t{min-width:0}
.badge{font-size:.66rem;font-weight:700;letter-spacing:.04em;text-align:center;padding:1px 0;border:1px solid currentColor}
.b-good{color:var(--plus)} .b-normal{color:var(--muted)} .b-bad{color:var(--minus)} .b-soc{color:var(--soc)} .b-fork{color:var(--accent)} .b-life{color:var(--ink)}
.b-slope{color:var(--minus);border-style:dashed} .b-rise{color:var(--plus);border-style:dashed} .b-gray{color:var(--muted);border-color:transparent}
.log li.slope .t{color:var(--minus)}
.opts.one{grid-template-columns:1fr}
.b-rainbow{border:0;color:#fff;background:linear-gradient(90deg,#e0565b,#e8a33d,#5bb26a,#3f88c5,#8a5cc2)}
.log li.rainbow{background:color-mix(in srgb,var(--mark) 18%,transparent)}
.log li.fresh{animation:in .35s ease}
@keyframes in{from{background:color-mix(in srgb,var(--mark) 35%,transparent)}}

.review{display:grid;gap:18px}
.spark{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.spark div{font-size:.75rem;color:var(--muted);min-width:0}
.spark svg{display:block;width:100%;height:40px}
.spark b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.forks{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.forks li{font-size:.86rem;display:grid;grid-template-columns:3.2em 1fr;gap:8px}
.forks .a{font-family:var(--f-num);color:var(--muted)}
.forks small{display:block;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.facts div{border-top:1px solid var(--rule);padding-top:6px;font-size:.75rem;color:var(--muted)}
.facts b.neg{color:var(--minus)}
.facts b{display:block;font-family:var(--f-num);font-size:1.05rem;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>確率人生</h1>

</div>

/* ========== 傾き：マイナスの積み重ねで少しずつ深まる状態 ========== */
const CONDS={
 iso:{n:"孤立",gap:s=>31-s.bond,up:["","誰とも深く話さない日が増えてきた。","誘いを断るのが、いつの間にか癖になった。","人と自分のあいだに、薄い膜があるように感じる。"],down:"少しずつ、人と話すのが苦ではなくなってきた。",drain:{happy:-1}},
 tired:{n:"疲弊",gap:s=>s.age>=65?-99:33-s.health+(s.status==="work"&&s.job&&s.job.inc>500?5:0),up:["","朝起きても、疲れが抜けなくなってきた。","休日はほとんど寝て過ごすようになった。","体が鉛のように重い。"],down:"体が少し軽くなった。",drain:{happy:-.5,health:-.5}},
 poor:{n:"困窮",gap:s=>s.age<18||(s.status==="hikikomori"&&s.parentsAlive)?-99:s.money<-300?Math.min(40,(-s.money-300)/25):s.money<30&&(!s.job||s.job.inc<220)&&s.status!=="college"&&s.status!=="retired"?3:-10,up:["","支払いの日が近づくと、胃が重くなる。","カードの支払いを、別のカードで回すようになった。","通帳を開くのが怖い。"],down:"家計に、少し余裕が戻ってきた。",drain:{happy:-1,health:-.5}},
 apathy:{n:"無気力",gap:s=>26-s.happy,up:["","好きだったことに、前ほど心が動かない。","何をしても楽しいと思えない日が増えた。","一日が、色のない時間として過ぎていく。"],down:"久しぶりに、心から笑った。",drain:{know:-.5,bond:-.5}}
};
const PRESS_MAP={bond:"iso",health:"tired",money:"poor",happy:"apathy"};
function updateConds(){
  for(const k in CONDS){const c=CONDS[k],g=c.gap(s),lv=s.cd[k];
    if(g>0&&lv<3){const p=Math.min(.6,.03+g/70+s.press[k]*.05);
      if(Math.random()<p){s.cd[k]++;addRow("slope","傾き",c.up[s.cd[k]]);lv3(k)}}
    else if(g<-5&&lv>0&&Math.random()<.3+(-g)/100){s.cd[k]--;addRow("rise","回復",c.down)}
    s.press[k]*=.6;
    for(let i=0;i<s.cd[k];i++)for(const st in c.drain)s[st]=clamp(s[st]+c.drain[st]);}
}
function lv3(k){if(s.cd[k]<3)return;
  if(k==="iso"){
    if(s.status==="school"&&s.age>=10&&s.age<=17){s.status="futoko";s.hikiSince=s.age;addRow("slope","傾き","ある朝、玄関で足が動かなくなった。学校に行かない日が続いた。")}
    else if(s.status==="jobless"&&s.age<60){s.status="hikikomori";s.hikiSince=s.hikiSince||s.age;addRow("slope","傾き","外に出ない日が、週から月になり、月から年になった。")}}
  if(k==="tired"&&s.status==="work"&&Math.random()<.5){s.status="jobless";s.job=null;addRow("slope","傾き","休職ののち、仕事を辞めた。")}
  if(k==="apathy"&&s.job){s.job.inc*=.92;addRow("slope","傾き","仕事でミスが続いた。評価が下がった。")}

const TRACKS=Object.fromEntries((GEN.tracks||[]).map(t=>[t.id,t]));
const fill=t=>typeof t==="string"?t.replace(/\{pref\}/g,s.pref).replace(/\{job\}/g,s.job?s.job.name:"仕事"):t;

function req(r){
  if(!r)return true;
  if(r.status&&!r.status.includes(s.status))return false;
  if(r.married!==undefined&&!!s.married!==r.married)return false;
  if(r.kids_min!==undefined&&s.kids<r.kids_min)return false;
  if(r.money_min!==undefined&&s.money<r.money_min)return false;
  if(r.money_max!==undefined&&s.money>r.money_max)return false;
  for(const k in r.stat_min||{})if(s[k]<r.stat_min[k])return false;
  for(const k in r.stat_max||{})if(s[k]>r.stat_max[k])return false;
  for(const k in r.cond_min||{})if(s.cd[k]<r.cond_min[k])return false;
  for(const k in r.cond_max||{})if(s.cd[k]>r.cond_max[k])return false;
  if(r.parents_alive!==undefined&&s.parentsAlive!==r.parents_alive)return false;
  if(r.goal&&!r.goal.includes(s.goal))return false;
  if(r.track&&s.track!==r.track)return false;
  if(r.flags_any&&!r.flags_any.some(f=>s.flags[f]))return false;
  if(r.flags_none&&r.flags_none.some(f=>s.flags[f]))return false;
  return true;
}
const genFx=fx=>{const o={};for(const k in fx||{})o[k==="income_mul"?"incMul":k]=fx[k];return o};
function applySet(st){
  if(!st)return;
  if(st.job)setJob(s,st.job.name,st.job.income,st.job.grow,st.job.kind);
  if(st.status){s.status=st.status;if(st.status!=="work")s.job=null;if(st.status==="hikikomori")s.hikiSince=s.hikiSince||s.age}
  if(st.married!==undefined)s.married=st.married;
  if(st.kids_delta)s.kids=Math.max(0,s.kids+st.kids_delta);
  for(const f of st.flags||[])s.flags[f]=1;
  for(const k in st.cond||{})s.cd[k]=Math.max(0,Math.min(3,s.cd[k]+st.cond[k]));
  for(const k in st.press||{})s.press[k]+=st.press[k];
  if(st.track){s.track=st.track;s.trackSince=s.age}
  if(st.bankrupt){s.money=0;s.flags.bankrupt=1;s.bankruptAge=s.age;s.cd.poor=0}
}
const prioOf=x=>{const r=x.requires||{};return !!(r.cond_min||r.money_max!==undefined&&r.money_max<0||(r.status||[]).some(v=>v==="hikikomori"||v==="jobless"||v==="futoko"))};
function genDecision(x){
  return{id:x.id,title:x.title,text:fill(x.text),gen:1,choices:x.choices.map(c=>{const r=c.roll,av=()=>avgOf(s,r.stats);
    const mk=(k,w)=>{const z=r[k];return o(z.label,w,genFx(z.fx),fill(z.text),z.set?()=>applySet(z.set):undefined)};
    return{l:c.label,cost:-(c.cost&&c.cost.money||0),fx:genFx(c.fx),roll:{q:r.name,why:r.stats,o:[
      mk("good",()=>Math.max(1,av()-r.difficulty)),mk("mid",45),mk("bad",()=>Math.max(1,(100-av())*.45))]}}})};
}
function genEligible(x){
  const a=x.age||[0,120];
  if(s.age<a[0]||s.age>a[1])return false;
  if(!req(x.requires))return false;
  if(x.spend){const m=-(x.fx&&x.fx.money||0);if(s.money<m*3||s.cd.poor>0)return false}
  return true;
}

/* 虹：能力条件（gate）を満たしたときだけ、虹のルーレットに巡り合う */
function gateOk(t){const g=t.gate||{};if(s.track||s.trackTried[t.id]>=1||Object.keys(s.trackTried).length>=2)return false;
  if(g.age&&(s.age<g.age[0]||s.age>g.age[1]))return false;
  for(const k in g.stat_min||{})if(s[k]<g.stat_min[k])return false;
  if(g.goal&&!g.goal.includes(s.goal))return false;
  return true}
function rainbowDecision(t){
  const c=t.chance,av=()=>avgOf(s,c.stats);
  s.trackTried[t.id]=(s.trackTried[t.id]||0)+1;
  return{rainbow:1,title:"★ 虹の兆し",text:`${t.name}への道が、一瞬だけ開いている。`,choices:[
    {l:"運命に身を任せる",fx:{},roll:{q:c.name,why:c.stats,o:[
      o("道が開く",()=>Math.max(.5,(av()-c.difficulty)*.45),genFx(c.hit.fx),c.hit.text,()=>{if(c.hit.job)setJob(s,c.hit.job.name,c.hit.job.income,c.hit.job.grow,c.hit.job.kind);s.track=t.id;s.trackSince=s.age;s.rainbow++}),
      o("すれ違う",()=>45+(100-av())*.45,genFx(c.miss.fx),c.miss.text)]}}]};
}
function trackEnd(){
  const t=TRACKS[s.track];if(!t||!t.end||s.trackEnded)return;
  const a=t.end.age;if(s.age<a[0])return;
  if(s.age>=a[1]||Math.random()<.3){s.trackEnded=1;addRow("life","区切り",t.end.text);if(t.end.job)setJob(s,t.end.job.name,t.end.job.income,t.end.job.grow,t.end.job.kind)}
}

/* ========== 状態 ========== */
const PREFS=[["東京都",14],["神奈川県",9],["大阪府",8],["愛知県",7],["埼玉県",6],["千葉県",5],["兵庫県",5],["北海道",5],["福岡県",4],["静岡県",3],["茨城県",2],["広島県",2],["宮城県",2],["新潟県",2],["長野県",2],["福島県",2],["熊本県",2],["岡山県",2],["鹿児島県",2],["沖縄県",1],["青森県",1],["石川県",1],["高知県",1],["山形県",1]];
let s,auto=false,timer=null,speed=1,pending=false;
const SPEED={1:1300,2:650,4:300};

function newLife(){
  const by=R(1975,2000);
  s={age:0,year:by,birthYear:by,pref:PREFS[pickW(PREFS,p=>p[1])][0],fam:2,parent:"",
    health:clamp(50+R(0,30)),happy:clamp(45+R(-10,10)),know:clamp(10+R(0,12)),bond:clamp(33+R(-12,22)),luck:clamp(25+R(0,50)),
    money:0,status:"school",job:null,jobs:[],goal:null,married:false,kids:0,flags:{},hist:[],forks:[],rainbow:0,peak:0,minMoney:0,hikiYears:0,alive:true,
    cd:{iso:0,tired:0,poor:0,apathy:0},press:{iso:0,tired:0,poor:0,apathy:0},decUsed:{},lastDec:0,parentsAlive:true,slopeMax:0,track:null,trackTried:{},pendingRainbow:null};
  {const m=R(22,38);s.parents=[{n:"母",a:m,alive:1},{n:"父",a:m+R(-1,5),alive:1}]}
  used.clear();
  $("log").innerHTML="";$("controls").hidden=false;

/* ========== 1年の処理 ========== */
function applyFx(fx){for(const k in fx){const v=fx[k];
  if(k==="money")s.money+=v;else if(k==="incMul"){if(s.job)s.job.inc*=v}else s[k]=clamp(s[k]+v)}}
const totalLv=()=>s.cd.iso+s.cd.tired+s.cd.poor+s.cd.apathy;
function tierOf(){const l=(s.luck-50)/100,sl=totalLv()*.025;
  const rb=.05*(0.4+s.luck/83),good=Math.max(.1,.35+l*.2-sl),normal=.4;const r=Math.random();
  if(r<rb)return"rainbow";if(r<rb+good)return"good";if(r<rb+good+normal)return"normal";return"bad"}
function stageKey(){const st=s.status;
  if(st==="hikikomori"||st==="futoko")return"hiki";
  if(s.age<=12)return"child";if(s.age<=18&&st==="school")return"teen";if(s.age>=62)return"senior";return"adult"}
const used=new Set();
function yearlyEvent(){
  let tier=tierOf();
  if(tier==="rainbow"){
    const ts=(GEN.tracks||[]).filter(gateOk);
    if(ts.length){s.pendingRainbow=ts[R(0,ts.length-1)];addRow("rainbow","★ 虹","何かが起こりそうな予感がする。");return}
    tier="good"}
  /* 無気力が深いと、何も起きない灰色の年が混ざる */
  if(tier!=="bad"&&s.cd.apathy>=2&&Math.random()<.4){applyFx({know:-1});addRow("gray","—","特に何もない一年だった。",{know:-1});return}
  /* 生成イベント（年齢・状態・支出の条件つき） */
  let g=GEN.events.filter(x=>x.tier===tier&&genEligible(x));
  if(g.length){
    const tr=g.filter(x=>x.requires&&x.requires.track);
    if(tr.length&&Math.random()<.5)g=tr;
    let cand=g.filter(x=>!used.has(x.id));if(!cand.length)cand=g;
    const x=cand[R(0,cand.length-1)];used.add(x.id);
    const fx=genFx(x.fx);applyFx(fx);applySet(x.set);
    if(tier==="bad")for(const k in fx)if(fx[k]<0&&PRESS_MAP[k])s.press[PRESS_MAP[k]]+=1.5;
    addRow(tier,tier,fill(x.text),fx);return}
  const pool=POOL[stageKey()][tier].filter(e=>(!e[2]||e[2](s))&&!(tier!=="bad"&&e[1].money<0&&(s.money<-e[1].money*3||s.cd.poor>0)));
  if(!pool.length){addRow("gray","—","特に何もない一年だった。");return}
  let cand=pool.filter(e=>!used.has(e[0]));if(!cand.length)cand=pool;
  const e=cand[R(0,cand.length-1)];used.add(e[0]);
  applyFx(e[1]);if(e[3])e[3](s);
  if(tier==="bad")for(const k in e[1])if(e[1][k]<0&&PRESS_MAP[k])s.press[PRESS_MAP[k]]+=1.5;
  addRow(tier,{good:"good",normal:"normal",bad:"bad"}[tier],e[0],e[1]);
}
function econ(){
  const st=s.status;let net=0,cost=0;
  if(st==="work"&&s.job){if(s.job.kind==="pro"&&s.age>=34&&!TRACKS.athlete){addRow("life","引退","現役を引退した。指導者として第二のキャリアが始まった。");setJob(s,"コーチ・解説者",420,.01,"corp")}
    s.job.inc=Math.max(60,s.job.inc*(1+(s.age<55?s.job.grow:-.02)));net=s.job.inc*.75;
    if(s.age>=70){addRow("life","引退","仕事を退いた。");s.pension=Math.round(70+s.job.inc*.25);s.status="retired";s.job=null}}
  if(s.status==="retired")net=s.pension||100;
  if(s.status==="college")net=20;
  if(s.status==="jobless")net=50;
  if(["work","jobless","retired"].includes(s.status)||(s.status==="hikikomori"&&!s.parentsAlive)){
    cost=(s.flags.home&&s.parentsAlive?140:240)+(s.married?110:0)+(s.age<58?s.kids*100:0)-(s.status==="jobless"||s.status==="hikikomori"?80:0);
    if(s.flags.house&&s.age<66)cost+=70;
    if(s.status==="retired")cost-=40;
    if(s.status!=="work"&&s.money<0)cost=Math.min(cost,net+20);
    if(s.status==="jobless")s.happy=clamp(s.happy-2);}
  if(s.status==="hikikomori"&&s.age>=18)s.hikiYears++;
  s.money+=net-cost;
  if(s.money<0&&s.age>=22)s.happy=clamp(s.happy-1);
}
function passive(){
  if(s.age>=6&&s.age<=18&&(s.status==="school"))s.know=clamp(s.know+2+(s.flags.private?1:0));
  if(s.status==="college")s.know=clamp(s.know+1.5);
  if(s.age>45)s.health=clamp(s.health-.6);
  if(s.age>65)s.health=clamp(s.health-1);
  if(s.age>80)s.health=clamp(s.health-1.5);
  if(s.age>72)s.know=clamp(s.know-.5);
  if(s.status==="futoko"&&s.age>=16){s.status="hikikomori";}
  if(s.status==="hikikomori"&&s.age>=65)s.status="retired",s.pension=70;
  if(s.status==="jobless"&&s.age>=65)s.status="retired",s.pension=Math.max(70,s.pension||0);
  if(s.flags.bankrupt&&s.age-s.bankruptAge>=7)delete s.flags.bankrupt;
  /* 両親の寿命：親の年齢で毎年判定（生命表に近い指数関数） */
  for(const p of s.parents)if(p.alive){const pa=p.a+s.age;
    if(pa>=50&&Math.random()<.00003*Math.exp(.095*pa)*(p.n==="父"?1.4:1)||pa>=105){p.alive=0;
      const last=!s.parents.some(q=>q.alive);s.happy=clamp(s.happy-(last?6:4));
      if(last){s.parentsAlive=false;const inh=Math.round([0,30,200,600,1500,5000][s.fam]*(.6+Math.random()*.8));s.money+=inh;
        addRow("life","別れ",`${p.n}を見送った（${pa}歳）。両親とも亡くなった。`+(inh>0?`相続した資産は${man(inh)}。`:"遺されたものは、ほとんどなかった。"),inh?{money:inh}:null)}
      else addRow("life","別れ",`${p.n}を見送った（${pa}歳）。`)}}
}
function deathCheck(){
  const p=.000028*Math.exp(.093*s.age)*(1.6-s.health/100*1.2);
  return s.age>=105||Math.random()<p;
}
function snap(){s.hist.push({age:s.age,health:s.health,happy:s.happy,know:s.know,bond:s.bond,luck:s.luck,money:s.money});s.peak=Math.max(s.peak,s.money);s.minMoney=Math.min(s.minMoney,s.money);s.slopeMax=Math.max(s.slopeMax,...Object.values(s.cd))}

/* 分岐の決め方：節目の年 ＋ 状態が深まったら回復の分岐 ＋ 3年空いたらプールから */
function eligible(p){return s.age>=p.min&&s.age<=p.max&&(!p.cond||p.cond(s))&&(s.decUsed[p.id]===undefined||(p.prio&&s.age-s.decUsed[p.id]>=8))}
function fromPool(p){s.decUsed[p.id]=s.age;return{title:p.title,text:p.text,choices:p.ch}}
const genOk=(x,prio)=>genEligible(x)&&(s.decUsed[x.id]===undefined||(prio&&s.age-s.decUsed[x.id]>=8));
function fromGen(x){s.decUsed[x.id]=s.age;return genDecision(x)}
const pick=a=>a[R(0,a.length-1)];
function nextDecision(){
  const a=s.age;
  if(s.pendingRainbow){const t=s.pendingRainbow;s.pendingRainbow=null;return rainbowDecision(t)}
  if(a<6)return null;
  if(MILESTONE.includes(a)){
    if(s.status==="futoko"&&a<15&&a!==12){const g=GEN.decisions.filter(x=>prioOf(x)&&genOk(x,1));return g.length?fromGen(pick(g)):futokoDecision(s)}
    const d=pickDecision(s);if(d)return d;}
  if(a-s.lastDec>=2){
    const g=GEN.decisions.filter(x=>prioOf(x)&&genOk(x,1)),h=DPOOL.filter(p=>p.prio&&eligible(p));
    if(g.length||h.length)return g.length&&(!h.length||Math.random()<.75)?fromGen(pick(g)):fromPool(pick(h))}
  if(a-s.lastDec>=3&&!MILESTONE.includes(a+1)){
    const tr=GEN.decisions.filter(x=>x.requires&&x.requires.track&&genOk(x));
    if(tr.length&&Math.random()<.7)return fromGen(pick(tr));
    if(s.status==="futoko")return futokoDecision(s);
    if(s.status==="hikikomori")return hikiDecision(s);
    const g=GEN.decisions.filter(x=>!prioOf(x)&&genOk(x)),h=DPOOL.filter(p=>!p.prio&&eligible(p));
    if(g.length&&(!h.length||Math.random()<.8))return fromGen(pick(g));
    if(h.length)return fromPool(pick(h));
    return genericLife(s);}
  return null;
}

function step(){
  if(pending||!s.alive)return;
  s.age++;s.year++;
  passive();econ();
  const soc=SOCIETY[s.year];if(soc){const extra=soc[1](s);addRow("soc","社会",soc[0]+(extra?" "+extra:""))}
  yearlyEvent();
  updateConds();trackEnd();
  if(deathCheck()){die();return}
  snap();render();
  const d=nextDecision();if(d){s.lastDec=s.age;showDecision(d);return}
  if(auto)timer=setTimeout(step,SPEED[speed]);
}

/* ========== 表示 ========== */
function chips(fx){
  const out=[];for(const k in fx){const v=fx[k];if(!v)continue;
    if(k==="money")out.push(`<span class="chip ${v>0?"p":"m"}">資産 ${v>0?"+":""}${man(v)}</span>`);
    else if(k==="incMul"){if(v!==1)out.push(`<span class="chip ${v>1?"p":"m"}">年収 ×${v.toFixed(2)}</span>`)}
    else out.push(`<span class="chip ${v>0?"p":"m"}">${SN[k]} ${v>0?"+":"−"}${Math.abs(v)}</span>`)}
  return out.length?` <span class="chips">${out.join("")}</span>`:"";
}
function addRow(kind,label,text,fx){
  const li=document.createElement("li");li.className="fresh"+(kind==="rainbow"?" rainbow":kind==="slope"?" slope":"");
  li.innerHTML=`<span class="a">${s.age}歳</span><span class="badge b-${kind}">${label}</span><span class="t">${echo(text)}${fx?chips(fx):""}</span>`;

}
function statusLabel(){const st=s.status,a=s.age;
  if(st==="school")return a<6?"未就学":s.flags.tsushin&&a>=15?"通信制・高校生":a<=12?(s.flags.private?"私立小学生":"小学生"):a<=15?"中学生":"高校生";
  if(st==="futoko")return"不登校";if(st==="hikikomori")return"ひきこもり";
  if(st==="college")return s.flags.senmon?"専門学校生":"大学生";
  if(st==="work")return s.job.name;if(st==="jobless")return"無職";if(st==="retired")return"引退";return"—"}
function render(){
  $("age").innerHTML=`${s.age}<small>歳</small>`;$("status").textContent=statusLabel();
  $("meta").textContent=`${s.year}年 · ${s.pref}`+(s.goal?` · 夢：${GOALS[s.goal]}`:"")+(s.married?" · 既婚":"")+(s.kids?` · 子${s.kids}人`:"")+(s.track&&TRACKS[s.track]?` · ★${TRACKS[s.track].name}`:"")+(s.flags.bankrupt?" · 自己破産から再出発中":"");
  $("stats").innerHTML=STATS.map(([k,n])=>`<div class="stat"><label>${n}<b>${s[k]}</b></label><div class="bar"><i style="width:${s[k]}%"></i></div></div>`).join("");

function setAuto(v){auto=v;clearTimeout(timer);$("play").textContent=auto?"❚❚ 一時停止":"▶ 自動で進める";if(auto&&!pending)timer=setTimeout(step,300)}
$("play").onclick=()=>{if(!s.alive)return newLife();setAuto(!auto)};
$("step").onclick=()=>{if(!s.alive)return;setAuto(false);step()};

/* ========== 分岐カード ========== */
function showDecision(d){
  pending=true;clearTimeout(timer);
  const need=c=>(c.cost||0)+Math.max(0,-((c.fx||{}).money||0));
  let off=d.choices.map(c=>need(c)>0&&s.money<need(c));if(off.every(Boolean))off=off.map(()=>false);
  const sc=$("scene");sc.hidden=false;
  sc.innerHTML=`<div class="scene-head"><span class="yr">${s.year}年 · ${s.age}歳</span><h2>${d.title}</h2></div>
   <p class="story">${echo(tx(d.text,s))}</p>
   <span class="q">選択</span><div class="opts${d.choices.length===1?" one":""}" id="opts">${d.choices.map((c,i)=>`<button class="opt" data-i="${i}"${off[i]?" disabled":""}><span class="lbl">${c.l}</span>${chips(Object.assign({},c.cost?{money:-c.cost}:{},c.fx||{}))}${off[i]?'<span class="short">資金が足りない</span>':""}</button>`).join("")}</div>
   <div id="slot"></div>`;
  sc.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    sc.querySelectorAll(".opt").forEach(x=>{x.disabled=true;x.classList.add("done")});b.classList.add("picked");
    const c=d.choices[+b.dataset.i];if(c.cost)s.money-=c.cost;applyFx(c.fx||{});if(c.set)c.set(s);render();roll(d,c,c.roll)});
  sc.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});
}
function roll(d,c,r){
  const ws=r.o.map(x=>Math.max(.5,typeof x.w==="function"?x.w(s):x.w)),tot=ws.reduce((a,b)=>a+b,0);
  const ps=ws.map(w=>w/tot*100),res=pickW(ws,x=>x);
  const why=r.note||("影響："+(r.why||[]).map(k=>`${SN[k]} ${s[k]}`).join("・")),e=era(s);
  const box=document.createElement("div");box.className="roll";
  box.innerHTML=`<span class="q"><span>${r.q}</span><span class="why">${why}${r.era&&e.n?` ／ 時代：${e.n}`:""}</span></span>
   <div class="strip">${ps.map((p,j)=>`<div class="seg" style="width:${p}%;--s:${10+(j*60/Math.max(1,ps.length-1))|0}%"></div>`).join("")}<div class="needle"></div></div>
   <div class="legend">${r.o.map((x,j)=>`<span><span>${x.l}</span><b class="num">${ps[j]<1?"<1":Math.round(ps[j])}%</b></span>`).join("")}</div>`;
  $("slot").appendChild(box);
  let st=0;for(let j=0;j<res;j++)st+=ps[j];const target=st+ps[res]*(.2+Math.random()*.6);
  const nd=box.querySelector(".needle"),Dur=reduce?0:1600/Math.sqrt(speed),S=400+target,t0=performance.now();
  const tri=v=>{const m=v%200;return m<100?m:200-m};
  (function f(t){const k=Dur?Math.min(1,(t-t0)/Dur):1,ez=1-Math.pow(1-k,3);nd.style.left=tri(S*ez)+"%";if(k<1)requestAnimationFrame(f);else land(d,c,r,box,res,ps)})(t0);
}
function land(d,c,r,box,res,ps){
  const x=r.o[res];
  box.querySelectorAll(".seg")[res].classList.add("hit");box.querySelectorAll(".legend > span")[res].classList.add("hit");
  applyFx(x.fx);if(x.set)x.set(s);
  const out=document.createElement("p");out.className="outcome";out.innerHTML=echo(tx(x.t,s)||x.l)+chips(x.fx);box.appendChild(out);
  const pr=ps[res]<1?"<1":Math.round(ps[res]);
  if(d.rainbow){addRow("rainbow","★ 虹",`${r.q}：${x.l}（${pr}%）`)}
  else if(d.birth){addRow("life","誕生",`${r.q}：${x.l}（${pr}%）`)}
  else{s.forks.push({age:s.age,title:d.title,choice:c.l,res:x.l,p:pr,q:r.q});
    addRow("fork","分岐",`${d.title}：${c.l} → ${x.l}（${pr}%）`);}
  render();
  if(r===c.roll&&c.then){setTimeout(()=>roll(d,c,c.then(s)),reduce?0:500);return}
  snap();
  const nb=document.createElement("button");nb.className="btn next";nb.textContent=d.birth?"人生をはじめる":"続ける";
  nb.onclick=()=>{pending=false;$("scene").hidden=true;if(d.birth&&!auto)setAuto(true);else if(auto)timer=setTimeout(step,400);};
  box.appendChild(nb);nb.focus({preventScroll:true});
}

/* ========== 死と振り返り ========== */
function die(){
  s.alive=false;setAuto(false);snap();render();
  const cause=s.age<40?"突然の病で":s.health<30?"長い闘病の末に":s.age>=90?"眠るように":"静かに";
  addRow("life","死",`${s.year}年、${s.age}歳で${cause}息を引き取った。`);
  const career=s.hikiYears>=10?"長い時間を部屋の中で過ごし":s.jobs.length?`${s.jobs.includes("プロ選手")?"プロ選手として活躍し":[...new Set(s.jobs)].slice(-2).join("、") + "として働き"}`:"働くことはなく";
  const sc=$("scene");sc.hidden=false;$("controls").hidden=true;
  sc.innerHTML=`<div class="scene-head"><span class="yr">${s.birthYear}–${s.year}</span><h2>ある人生の記録</h2></div>
   <p class="story">${s.pref}の${s.parent}（世帯年収${FAM[s.fam][0]}）に生まれ、${career}、${s.age}歳で亡くなった。${s.married?"結婚し":"結婚はせず"}、${s.kids?`子どもを${s.kids}人育てた。`:"子どもはいなかった。"}${s.track&&TRACKS[s.track]?`★${TRACKS[s.track].name}の道を${s.trackSince}歳から歩いた。`:""}${s.bankruptAge?`${s.bankruptAge}歳で自己破産し、そこから立て直した。`:""}</p>
   <div class="review">
    <div class="facts">
      <div>最終資産<b class="${s.money<0?"neg":""}">${man(s.money)}</b></div>
      <div>最大資産<b>${man(s.peak)}</b></div>
      <div>虹イベント<b>${s.rainbow}回</b></div>
      <div>分岐<b>${s.forks.length}回</b></div>
      <div>最も深い傾き<b>${s.slopeMax}／3</b></div>
    </div>
    <div><h3>パラメータの推移</h3><div class="spark">${STATS.map(([k,n])=>`<div>${n} <b>${s[k]}</b>${spark(k)}</div>`).join("")}<div>資産 <b>${man(s.money)}</b>${spark("money")}</div></div></div>
    <div><h3>分岐点</h3><ul class="forks">${s.forks.map(l=>`<li><span class="a">${l.age}歳</span><span>${l.title}：${l.choice}<small>${l.q}：${l.p}%の「${l.res}」を引いた</small></span></li>`).join("")}</ul></div>
    <button class="btn" id="again" style="justify-self:start">もう一度生まれる</button>
   </div>`;
  $("again").onclick=()=>{newLife();window.scrollTo({top:0})};
}
function spark(k){
  const h=s.hist,mx=Math.max(...h.map(x=>x.age),1);
  let lo=0,hi=100;if(k==="money"){lo=Math.min(...h.map(x=>x.money),0);hi=Math.max(...h.map(x=>x.money),1)}
  const y=v=>(37-(v-lo)/(hi-lo||1)*34).toFixed(1);
  const pts=h.map(x=>`${(x.age/mx*100).toFixed(1)},${y(x[k])}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  const zero=k==="money"&&lo<0?`<line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="var(--minus)" stroke-width="0.6" stroke-dasharray="2 2"/>`:"";
  return`<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">${zero}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="1.8" fill="var(--accent)"/></svg>`;
}

newLife();
</script>
